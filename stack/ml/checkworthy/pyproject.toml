[project]
name = "checkworthy-gate"
version = "0.1.0"
description = "Training pipeline for the local French check-worthiness classifier (VER-225): dataset build from Postgres, CamemBERTa-v2 fine-tune, temperature calibration folded into the exported ONNX head."
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.13.0",
    "transformers>=4.57,<4.58",
    "optimum>=2.1,<2.2",
    "optimum-onnx==0.1.0",
    "onnxruntime==1.28.0",
    "onnx==1.22.0",
    "psycopg[binary]==3.3.4",
    "numpy==2.5.2",
    "scikit-learn==1.9.0",
]

[project.scripts]
checkworthy-gate = "checkworthy_gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkworthy_gate"]
