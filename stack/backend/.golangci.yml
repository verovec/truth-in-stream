# golangci-lint v2 config. Runner version is pinned in .golangci-lint-version
# and resolved by the CI action; keep the two in sync.
#
# Enforces the documented backend lint standard: the v2 `standard` set
# (errcheck, govet, ineffassign, staticcheck, unused) plus the additions below.
# wrapcheck is intentionally NOT enabled - it is too noisy at boundaries; adding
# it, or any nolint, needs a written decision in the PR description.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose # response bodies must be closed
    - gocritic # opinionated correctness and style diagnostics
    - godot # doc comments end with a period
    - misspell # spelling in comments and strings
    - noctx # HTTP requests must carry a context
    - prealloc # preallocate slices of known size
    - revive # broad golint-style ruleset
    - unparam # unused function parameters and results
  settings:
    misspell:
      locale: US
      # French data labels rendered into statistical evidence passages (e.g.
      # "nationalités", "demandes d'asile") and open-data column names
      # ("pays_nationalite", "nb_demandes") are not English misspellings; ignore
      # the words the US dictionary flags as near-misses for English words.
      ignore-rules:
        - nationalit
        - nationalite
        - demandes
        - transferts
        - Licence
        # INSEE BDM SDMX wire-format codes (UNIT_MEASURE values) carried verbatim
        # in the adapter, not English misspellings.
        - INDIVIDUS
        # The document analysis lifecycle value fixed by the PDF fact-check
        # design (documents.analysis_status = 'analysing'): API and DB
        # vocabulary, not prose to be re-spelled.
        - analysing
        # Official French name of the OECD (OCDE = "Organisation de coopération
        # et de développement économiques") stamped verbatim on OECD evidence
        # citations; a proper noun, not an English misspelling.
        - Organisation
        # French open-data labels and dataset slugs carried verbatim by the
        # OpenDataSoft/SSMSI connector (secteur d'activité, temps partiel,
        # gendarmerie nationales), not English misspellings.
        - activite
        - partiel
        - nationales
        # French parliamentary open-data terms (AN/Senat) carried verbatim into
        # rendered evidence passages, JSON field names, and jsonb metadata keys:
        # "reponse" (answer), "chambre" (chamber), "identite" (identity),
        # "licences". Not English misspellings.
        - reponse
        - chambre
        - identite
        - licences
        # French institutional open-data terms (vie-publique discours, HATVP
        # declarations) carried verbatim into rendered evidence passages, XML/JSON
        # field names, and jsonb metadata keys: "employeur" (employer), "activite"
        # (activity, incl. accented "Activites"), "mandats" (mandates), "organes"
        # (organs/bodies). Not English misspellings.
        - employeur
        - activit
        - mandats
        - organes
        - prononciation
  exclusions:
    # Exclude sqlc-generated code (internal/store/db) by the canonical
    # "// Code generated ... DO NOT EDIT." header only.
    generated: strict

issues:
  # Never silently cap the gate: the defaults (50 per linter, 3 per message)
  # would hide real findings in future code. 0 disables both caps.
  max-issues-per-linter: 0
  max-same-issues: 0
