version: "2"
sql:
  - engine: "postgresql"
    # Reuse the golang-migrate up files as the schema source. Only *.up.sql so
    # the DROP statements in the down files do not cancel out the schema.
    schema:
      - "migrations/*.up.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # The pgx/v5 driver maps a uuid column to pgtype.UUID by default; map
          # it to google/uuid.UUID instead for an ergonomic, stringable id.
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # sqlc has no built-in mapping for pgvector's halfvec; map the column
          # to pgvector-go's HalfVector (implements Scanner/Valuer).
          - column: "claims.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
          # political_claims.embedding is NOT NULL (the crawler writes content and
          # vector together), so it maps to a value HalfVector like claims.embedding.
          - column: "political_claims.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
          # evidence_chunks.embedding is nullable (filled by the bulk-embedding
          # pipeline), so the override is a pointer: nil maps to SQL NULL.
          - column: "evidence_chunks.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
              pointer: true
