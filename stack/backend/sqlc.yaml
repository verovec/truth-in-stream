version: "2"
sql:
  - engine: "postgresql"
    # Reuse the golang-migrate up files as the schema source. Only *.up.sql so
    # the DROP statements in the down files do not cancel out the schema.
    schema:
      - "migrations/*.up.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # sqlc has no built-in mapping for pgvector's halfvec; map the column
          # to pgvector-go's HalfVector (implements Scanner/Valuer).
          - column: "documents.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
