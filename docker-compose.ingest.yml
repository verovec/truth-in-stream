# Cloud ingestion override, run ON an EC2 ingestion host (never locally). Unlike
# docker-compose.yml, this file has no postgres/rabbitmq/minio: the host talks to
# the managed Amazon MQ broker (AMQPS 5671) and the dev RDS (5432) instead, and
# every service runs the prebuilt backend ECR image by its compiled entrypoint
# (/wikicrawl, /crawlworker, ...) - never `go run`, so nothing is built here.
#
# Every value is interpolated from a materialized ./.env that the host writes
# from Secrets Manager before Compose runs (scripts/ingest-fetch-env.sh) plus the
# INGEST_IMAGE / INGEST_ENV / AWS_REGION the operator command exports; the secrets
# (RABBITMQ_URL, DATABASE_URL, and the API keys) never appear in this file. The
# operator command scripts/ingest-host.sh drives one service at a time over SSM:
#   /crawler <source>  -> `docker compose -f docker-compose.ingest.yml run --rm <producer>`
#   /consumer <source> -> `docker compose -f docker-compose.ingest.yml up -d <worker>`
#
# Source -> producer / queue / worker:
#   wikipedia         wikicrawl        / crawl.chunks     / crawlworker
#   stats             statsingest      / embedding.jobs   / embedworker
#   sdmx              sdmxcrawl        / embedding.jobs   / embedworker
#   ods               odsingest        / embedding.jobs   / embedworker
#   factcheck         factcheckcrawl   / factcheck.claims / factcheckworker
#   scrutins          scrutinscrawl    / scrutins.votes   / scrutinsworker
#   an-amendements    parliamentcrawl  / evidence.chunks  / evidenceworker
#   an-questions      parliamentcrawl  / evidence.chunks  / evidenceworker
#   an-comptesrendus  parliamentcrawl  / evidence.chunks  / evidenceworker
#   senat-questions   parliamentcrawl  / evidence.chunks  / evidenceworker
#   senat-dosleg      parliamentcrawl  / evidence.chunks  / evidenceworker
#   senat-scrutins    parliamentcrawl  / scrutins.votes   / scrutinsworker
#   datacommons       datacommonscrawl / factcheck.claims / factcheckworker
#   claimreview       claimreviewcrawl / factcheck.claims / factcheckworker
#   claimskg          claimskgseed     / factcheck.claims / factcheckworker  (one-shot seed)
#   viepublique       viepubliquecrawl / evidence.chunks  / evidenceworker
#   hatvp             hatvpcrawl       / evidence.chunks  / evidenceworker
#   legifrance        legifrancecrawl  / evidence.chunks  / evidenceworker
#
# Container logs ship to CloudWatch Logs under /truth-in-stream/<env>/ingest/*,
# the exact prefix the host instance profile is scoped to write; the operator
# command also mirrors each producer run's stdout/stderr back over SSM.
#
# Validate offline with the image set (an empty image is an invalid project):
#   INGEST_IMAGE=<acct>.dkr.ecr.eu-west-3.amazonaws.com/truth-in-stream-dev-backend:sha-abc \
#     docker compose -f docker-compose.ingest.yml config

# Common awslogs options merged into each service's options map (deep-merge at the
# options level, since a top-level `<<` on `logging` would not merge nested keys).
# Each service overrides awslogs-group and awslogs-stream-prefix with its own name.
x-awslogs-options: &awslogs-options
  awslogs-region: "${AWS_REGION:-eu-west-3}"
  awslogs-create-group: "true"

services:
  # --- Producers (run by /crawler; one-shot, publish to the broker and exit) ---

  # wikipedia: walk CRAWL_CATEGORIES over the MediaWiki Action API and publish
  # self-contained chunk jobs to crawl.chunks. DB-free. CRAWL_CATEGORIES is
  # required (the operator command forwards it); the fact-checkability gate reads
  # its key from the materialized env.
  wikicrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/wikicrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      CRAWL_CATEGORIES: "${CRAWL_CATEGORIES:-}"
      CRAWL_PROJECT: "${CRAWL_PROJECT:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-}"
      CRAWL_CORPUS: "${CRAWL_CORPUS:-}"
      CRAWL_MAX_DEPTH: "${CRAWL_MAX_DEPTH:-}"
      CRAWL_MAX_PAGES: "${CRAWL_MAX_PAGES:-}"
      CRAWL_INCLUDE_BODY: "${CRAWL_INCLUDE_BODY:-}"
      CRAWL_SHARDS: "${CRAWL_SHARDS:-}"
      CRAWL_SHARD_INDEX: "${CRAWL_SHARD_INDEX:-}"
      CRAWL_CHECKPOINT_PATH: "${CRAWL_CHECKPOINT_PATH-/state/crawl-checkpoint.json}"
      CRAWL_ERROR_BUDGET: "${CRAWL_ERROR_BUDGET:-}"
      CRAWL_GATE_FAIL_MODE: "${CRAWL_GATE_FAIL_MODE:-}"
      CRAWL_CHECKWORTHY: "${CRAWL_CHECKWORTHY:-}"
      CHECKWORTHY_API_KEY: "${CHECKWORTHY_API_KEY:-}"
      CRAWL_CHECKWORTHY_MODEL: "${CRAWL_CHECKWORTHY_MODEL:-}"
      CRAWL_CHECKWORTHY_CONCURRENCY: "${CRAWL_CHECKWORTHY_CONCURRENCY:-}"
      CRAWL_CHECKWORTHY_RPM: "${CRAWL_CHECKWORTHY_RPM:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - crawl-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/wikicrawl"
        awslogs-stream-prefix: "wikicrawl"

  # stats: fetch the curated statistical series, render French passages, upsert
  # them un-embedded into wiki_chunks, and publish one embedding job per passage
  # to embedding.jobs. Writes to the DB, so it needs DATABASE_URL. Keyless
  # (optional INSEE_API_KEY).
  statsingest:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/statsingest"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
      INSEE_API_KEY: "${INSEE_API_KEY:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/statsingest"
        awslogs-stream-prefix: "statsingest"

  # sdmx: fetch the curated macro series from the anonymous SDMX institutions
  # (ECB, OECD), render each observation into a French evidence passage, upsert it
  # un-embedded and publish one embed job each to embedding.jobs. Writes to the DB,
  # so it needs DATABASE_URL. Keyless. SDMX_SOURCES / SDMX_START_PERIOD /
  # SDMX_END_PERIOD are optional non-secret knobs the operator command forwards.
  sdmxcrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/sdmxcrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      SDMX_SOURCES: "${SDMX_SOURCES:-}"
      SDMX_START_PERIOD: "${SDMX_START_PERIOD:-}"
      SDMX_END_PERIOD: "${SDMX_END_PERIOD:-}"
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/sdmxcrawl"
        awslogs-stream-prefix: "sdmxcrawl"

  # ods: fetch the OpenDataSoft portals (DREES/DARES/URSSAF) and the SSMSI
  # delinquency CSV bases, upsert un-embedded passages, and publish embedding jobs
  # to embedding.jobs (drained by embedworker, like stats). Keyless open data, so
  # no secret; needs the broker and the database. WIKI_ENQUEUE_BATCH_SIZE tunes the
  # publish page size (forwarded by the operator command).
  odsingest:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/odsingest"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/odsingest"
        awslogs-stream-prefix: "odsingest"

  # factcheck: read already-checked French claims from the Google Fact Check Tools
  # API and publish curated-claim jobs to factcheck.claims. DB-free.
  # FACTCHECK_QUERIES is OPTIONAL (a broadened French topic rotation is the default
  # when it is unset); publisher-scoped streams over the outlet allowlist run
  # alongside it. FACTCHECK_API_KEY comes from the materialized env.
  factcheckcrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/factcheckcrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      FACTCHECK_API_KEY: "${FACTCHECK_API_KEY:-}"
      FACTCHECK_QUERIES: "${FACTCHECK_QUERIES:-}"
      FACTCHECK_PUBLISHER_SITES: "${FACTCHECK_PUBLISHER_SITES:-}"
      FACTCHECK_LANGUAGE: "${FACTCHECK_LANGUAGE:-}"
      FACTCHECK_MAX_PAGES: "${FACTCHECK_MAX_PAGES:-}"
      FACTCHECK_MAX_AGE_DAYS: "${FACTCHECK_MAX_AGE_DAYS:-}"
      FACTCHECK_CHECKPOINT_PATH: "${FACTCHECK_CHECKPOINT_PATH-/state/factcheck-checkpoint.json}"
    volumes:
      - factcheck-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/factcheckcrawl"
        awslogs-stream-prefix: "factcheckcrawl"

  # datacommons: read the DataCommons ClaimReview daily feed, keep the records
  # from the DATACOMMONS_OUTLET_ALLOWLIST of vetted French outlets, and publish
  # curated-claim jobs to the same factcheck.claims queue the factcheck source
  # uses (drained by factcheckworker). DB-free and keyless: the feed is a public
  # object, so no API key and no new worker. All DATACOMMONS_* have defaults.
  datacommonscrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/datacommonscrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATACOMMONS_FEED_URL: "${DATACOMMONS_FEED_URL:-}"
      DATACOMMONS_OUTLET_ALLOWLIST: "${DATACOMMONS_OUTLET_ALLOWLIST:-}"
      DATACOMMONS_MAX_ITEMS: "${DATACOMMONS_MAX_ITEMS:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/datacommonscrawl"
        awslogs-stream-prefix: "datacommonscrawl"

  # claimreview: read schema.org ClaimReview JSON-LD directly from the allowlisted
  # French outlets (sitemap-discovered, robots- and pacing-respecting), extract only
  # claim/rating/URL/date, and publish to factcheck.claims (drained by
  # factcheckworker). DB-free and keyless. All CLAIMREVIEW_* have defaults.
  claimreviewcrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/claimreviewcrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      CLAIMREVIEW_USER_AGENT: "${CLAIMREVIEW_USER_AGENT:-}"
      CLAIMREVIEW_MIN_DELAY_MS: "${CLAIMREVIEW_MIN_DELAY_MS:-}"
      CLAIMREVIEW_MAX_URLS: "${CLAIMREVIEW_MAX_URLS:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/claimreviewcrawl"
        awslogs-stream-prefix: "claimreviewcrawl"

  # claimskg: one-shot historical seed. Imports a ClaimsKG CSV/TSV export (mounted at
  # CLAIMSKG_SEED_FILE) into political_claims via factcheck.claims. Does nothing
  # unless CLAIMSKG_SEED_ENABLED=true, so the large 2023 snapshot is only ingested on
  # a deliberate operator run. DB-free and keyless.
  claimskgseed:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/claimskgseed"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      CLAIMSKG_SEED_ENABLED: "${CLAIMSKG_SEED_ENABLED:-}"
      CLAIMSKG_SEED_FILE: "${CLAIMSKG_SEED_FILE:-/state/claimskg-export.csv}"
      CLAIMSKG_SEED_VINTAGE: "${CLAIMSKG_SEED_VINTAGE:-}"
      CLAIMSKG_SEED_TSV: "${CLAIMSKG_SEED_TSV:-}"
    volumes:
      - factcheck-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/claimskgseed"
        awslogs-stream-prefix: "claimskgseed"

  # scrutins: conditionally download the Assemblee Nationale Scrutins archive
  # (skipped when unchanged via the persisted ETag marker) and publish one job per
  # scrutin to scrutins.votes. DB-free. Keyless.
  scrutinscrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/scrutinscrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      SCRUTINS_LEGISLATURE: "${SCRUTINS_LEGISLATURE:-}"
      SCRUTINS_MARKER_PATH: "${SCRUTINS_MARKER_PATH:-/state/scrutins-marker.json}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - scrutins-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/scrutinscrawl"
        awslogs-stream-prefix: "scrutinscrawl"

  # parliament: the one producer for every parliament dataset, selected by
  # PARLIAMENT_DATASET (an-amendements | an-questions | an-comptesrendus |
  # senat-questions | senat-dosleg | senat-scrutins). It conditionally downloads the
  # dataset's bulk dump (skipped when unchanged via the persisted ETag marker), diffs
  # it against a per-dataset manifest, and publishes only new or changed records: the
  # textual datasets emit generic evidence jobs to evidence.chunks, and senat-scrutins
  # emits chamber-aware scrutin jobs to scrutins.votes. DB-free. Keyless (public
  # Licence Ouverte / Senat open data). PARLIAMENT_DATASET is required (the operator
  # command forwards it); state files are derived per dataset under /state.
  parliamentcrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/parliamentcrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      PARLIAMENT_DATASET: "${PARLIAMENT_DATASET:-}"
      PARLIAMENT_LEGISLATURE: "${PARLIAMENT_LEGISLATURE:-}"
      PARLIAMENT_SINCE_YEAR: "${PARLIAMENT_SINCE_YEAR:-}"
      PARLIAMENT_MAX_ITEMS: "${PARLIAMENT_MAX_ITEMS:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - parliament-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/parliamentcrawl"
        awslogs-stream-prefix: "parliamentcrawl"

  # viepublique: download the DILA "Discours publics" metadata dump, diff it, and
  # publish one generic evidence job per speech metadata record to evidence.chunks
  # (drained by evidenceworker). DB-free. Keyless open data (Licence Ouverte v2.0).
  # VIEPUBLIQUE_MAX_ITEMS bounds a backfill run; state under /state.
  viepubliquecrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/viepubliquecrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      VIEPUBLIQUE_MAX_ITEMS: "${VIEPUBLIQUE_MAX_ITEMS:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - viepublique-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/viepubliquecrawl"
        awslogs-stream-prefix: "viepubliquecrawl"

  # hatvp: diff the HATVP declarations open-data index, fetch each new or changed
  # declaration's XML, and publish one generic evidence job per structured summary
  # to evidence.chunks (drained by evidenceworker). DB-free. Keyless open data.
  # HATVP_MAX_ITEMS bounds a backfill run; state under /state.
  hatvpcrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/hatvpcrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      HATVP_MAX_ITEMS: "${HATVP_MAX_ITEMS:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - hatvp-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/hatvpcrawl"
        awslogs-stream-prefix: "hatvpcrawl"

  # legifrance: fetch the configured narrow corpus of code articles from the DILA
  # Legifrance API via the PISTE OAuth2 gateway, diff each, and publish one generic
  # evidence job per article to evidence.chunks (drained by evidenceworker). DB-free.
  # PISTE credentials (LEGIFRANCE_CLIENT_ID / LEGIFRANCE_CLIENT_SECRET) come from the
  # materialized env (Secrets Manager on the host), never forwarded; absent
  # credentials degrade to a clean skip. LEGIFRANCE_ARTICLES is the corpus; state
  # under /state.
  legifrancecrawl:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/legifrancecrawl"]
    restart: "no"
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      LEGIFRANCE_CLIENT_ID: "${LEGIFRANCE_CLIENT_ID:-}"
      LEGIFRANCE_CLIENT_SECRET: "${LEGIFRANCE_CLIENT_SECRET:-}"
      LEGIFRANCE_ARTICLES: "${LEGIFRANCE_ARTICLES:-}"
      LEGIFRANCE_MAX_ITEMS: "${LEGIFRANCE_MAX_ITEMS:-}"
      LEGIFRANCE_MIN_INTERVAL_MS: "${LEGIFRANCE_MIN_INTERVAL_MS:-}"
      LEGIFRANCE_TOKEN_URL: "${LEGIFRANCE_TOKEN_URL:-}"
      LEGIFRANCE_API_BASE_URL: "${LEGIFRANCE_API_BASE_URL:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - legifrance-state:/state
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/legifrancecrawl"
        awslogs-stream-prefix: "legifrancecrawl"

  # --- Workers (run by /consumer; long-running, drain the queue into the DB) ---
  #
  # stop_grace_period is 120s so that on `docker compose down` / host stop the
  # worker gets the same SIGTERM-to-drain window the ECS task definition grants
  # (modules/worker stop_timeout, Fargate's 120s cap): an in-flight batch either
  # finishes or is nacked with requeue, never force-killed mid-write.

  # wikipedia consumer: drain crawl.chunks into live wiki_chunks (embeds).
  crawlworker:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/crawlworker"]
    restart: on-failure
    stop_grace_period: 120s
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      CRAWL_WORKER_CONCURRENCY: "${CRAWL_WORKER_CONCURRENCY:-}"
      CRAWL_WORKER_MAX_ATTEMPTS: "${CRAWL_WORKER_MAX_ATTEMPTS:-}"
      CRAWL_WORKER_RPM: "${CRAWL_WORKER_RPM:-}"
      # Drain-to-idle: exit cleanly after this window with an empty queue so the
      # consumer host can self-stop. Empty leaves the worker running until SIGTERM.
      WORKER_IDLE_TIMEOUT: "${WORKER_IDLE_TIMEOUT:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/crawlworker"
        awslogs-stream-prefix: "crawlworker"

  # stats consumer: drain embedding.jobs, embed a batch per Voyage call, and write
  # the vectors back into the live corpus in place.
  embedworker:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/embedworker"]
    restart: on-failure
    stop_grace_period: 120s
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EMBED_WORKER_CONCURRENCY: "${EMBED_WORKER_CONCURRENCY:-}"
      EMBED_WORKER_MAX_ATTEMPTS: "${EMBED_WORKER_MAX_ATTEMPTS:-}"
      EMBED_WORKER_RPM: "${EMBED_WORKER_RPM:-}"
      # Drain-to-idle: exit cleanly after this window with an empty queue so the
      # consumer host can self-stop. Empty leaves the worker running until SIGTERM.
      WORKER_IDLE_TIMEOUT: "${WORKER_IDLE_TIMEOUT:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/embedworker"
        awslogs-stream-prefix: "embedworker"

  # factcheck consumer: drain factcheck.claims, embed each claim, and upsert the
  # political claim record into the claim DB.
  factcheckworker:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/factcheckworker"]
    restart: on-failure
    stop_grace_period: 120s
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      CRAWL_WORKER_CONCURRENCY: "${CRAWL_WORKER_CONCURRENCY:-}"
      CRAWL_WORKER_MAX_ATTEMPTS: "${CRAWL_WORKER_MAX_ATTEMPTS:-}"
      CRAWL_WORKER_RPM: "${CRAWL_WORKER_RPM:-}"
      # Drain-to-idle: exit cleanly after this window with an empty queue so the
      # consumer host can self-stop. Empty leaves the worker running until SIGTERM.
      WORKER_IDLE_TIMEOUT: "${WORKER_IDLE_TIMEOUT:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/factcheckworker"
        awslogs-stream-prefix: "factcheckworker"

  # scrutins consumer: drain scrutins.votes, parse each scrutin, and upsert the
  # per-deputy voting records. Never embeds, so it needs no Voyage key.
  scrutinsworker:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/scrutinsworker"]
    restart: on-failure
    stop_grace_period: 120s
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      SCRUTINS_WORKER_CONCURRENCY: "${SCRUTINS_WORKER_CONCURRENCY:-}"
      SCRUTINS_WORKER_MAX_ATTEMPTS: "${SCRUTINS_WORKER_MAX_ATTEMPTS:-}"
      # Drain-to-idle: exit cleanly after this window with an empty queue so the
      # consumer host can self-stop. Empty leaves the worker running until SIGTERM.
      WORKER_IDLE_TIMEOUT: "${WORKER_IDLE_TIMEOUT:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/scrutinsworker"
        awslogs-stream-prefix: "scrutinsworker"

  # generic evidence consumer: drain evidence.chunks, embed each chunk, and upsert
  # it into the live evidence corpus. Source-neutral: it serves every connector
  # that targets evidence_chunks (an-amendements today).
  evidenceworker:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/evidenceworker"]
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL:-}"
      RABBITMQ_QUEUE_VERSIONS: "${RABBITMQ_QUEUE_VERSIONS:-}"
      RABBITMQ_DLQ_ENABLED: "${RABBITMQ_DLQ_ENABLED:-}"
      RABBITMQ_RECONNECT_MIN_BACKOFF: "${RABBITMQ_RECONNECT_MIN_BACKOFF:-}"
      RABBITMQ_RECONNECT_MAX_BACKOFF: "${RABBITMQ_RECONNECT_MAX_BACKOFF:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      EVIDENCE_WORKER_CONCURRENCY: "${EVIDENCE_WORKER_CONCURRENCY:-}"
      EVIDENCE_WORKER_MAX_ATTEMPTS: "${EVIDENCE_WORKER_MAX_ATTEMPTS:-}"
      EVIDENCE_WORKER_RPM: "${EVIDENCE_WORKER_RPM:-}"
      EVIDENCE_NEAR_DUP_SIMILARITY: "${EVIDENCE_NEAR_DUP_SIMILARITY:-}"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/evidenceworker"
        awslogs-stream-prefix: "evidenceworker"

  # tv capture: long-running headless viewer. Reconciles the enabled TV channels
  # against running capture pipelines (streamlink|ffmpeg), feeds PCM to the
  # backend's live hub, and archives hourly MPEG-TS segments as kind `tv`
  # recordings via the presign/register API. Unlike the queue workers it talks to
  # the backend HTTP API (TV_CAPTURE_BACKEND_URL) with a Keycloak client-
  # credentials service token, not the broker/DB directly. Idles when
  # TV_CAPTURE_ENABLED is unset. The salvage volume keeps partial segments across a
  # restart. Runtime wiring (host, SSM params, alerts) lands in the infra card.
  tvcapture:
    image: "${INGEST_IMAGE:?set INGEST_IMAGE to the backend ECR image ref}"
    entrypoint: ["/tvcapture"]
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      TV_CAPTURE_ENABLED: "${TV_CAPTURE_ENABLED:-}"
      TV_CAPTURE_BACKEND_URL: "${TV_CAPTURE_BACKEND_URL:-}"
      TV_CAPTURE_TOKEN_URL: "${TV_CAPTURE_TOKEN_URL:-}"
      TV_CAPTURE_CLIENT_ID: "${TV_CAPTURE_CLIENT_ID:-}"
      TV_CAPTURE_CLIENT_SECRET: "${TV_CAPTURE_CLIENT_SECRET:-}"
      TV_SEGMENT_SECONDS: "${TV_SEGMENT_SECONDS:-}"
      TV_RECORDING_RETENTION_DAYS: "${TV_RECORDING_RETENTION_DAYS:-}"
      TV_FEED_STALL_SECONDS: "${TV_FEED_STALL_SECONDS:-}"
      TV_CAPTURE_POLL_SECONDS: "${TV_CAPTURE_POLL_SECONDS:-}"
      TV_CAPTURE_WORK_DIR: "${TV_CAPTURE_WORK_DIR:-/work}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - tv-capture-work:/work
    logging:
      driver: awslogs
      options:
        <<: *awslogs-options
        awslogs-group: "/truth-in-stream/${INGEST_ENV:-dev}/ingest/tvcapture"
        awslogs-stream-prefix: "tvcapture"

volumes:
  # Persists the scrutins-archive conditional-GET marker across producer runs on
  # the same host, so an unchanged archive is a 304 and re-runs skip the download.
  scrutins-state:
  # Persists the parliament conditional-GET marker and per-identifier manifest
  # across producer runs on the same host, so an unchanged dump is a 304 and a
  # changed dump reprocesses only the records whose fingerprint moved.
  parliament-state:
  # Holds in-progress TV capture segments before upload, so a host restart leaves
  # partial .ts for the worker's startup salvage pass.
  tv-capture-work:
  # Persists the wikipedia crawl checkpoint across producer runs on the same host,
  # so a killed crawl resumes from its last completed batch instead of restarting.
  crawl-state:
  # Persists the fact-check per-stream checkpoint (and holds a mounted ClaimsKG seed
  # export) across producer runs on the same host, so a killed broadened Google run
  # resumes at the next undrained query stream instead of re-paging finished ones.
  factcheck-state:
  # Persists the vie-publique conditional-GET marker and per-identifier manifest, so
  # an unchanged dump is a 304 and a changed dump reprocesses only what moved.
  viepublique-state:
  # Persists the HATVP index conditional-GET marker and per-declaration manifest, so
  # an unchanged index is a 304 and only changed declarations are re-fetched.
  hatvp-state:
  # Persists the Legifrance per-article manifest, so an unchanged article is skipped
  # and only a re-consolidated article is republished.
  legifrance-state:
