# Local development. Source is bind-mounted and dev servers run with hot reload.
# Production images are built from stack/*/Dockerfile (used by the deploy workflow).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: truthinstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truthinstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the golang-migrate up migrations, then exits. The backend
  # waits for it so the schema exists before the API starts.
  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      - "up"
    volumes:
      - ./stack/backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: loads the local dataset - curated claims, the Wikipedia evidence
  # subset, and the precomputed demo-video results - into pgvector, then exits.
  # Idempotent (everything upserts by id). Embeddings come from the committed
  # cache (stack/backend/seed/embeddings.cache.jsonl), so this needs no API key;
  # EMBEDDING_API_KEY is only consulted to fill a cache miss after a fixture edit.
  # The backend waits for it so the stores are populated before the first match.
  seed:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/seed"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Opt-in (profile "wiki"), not part of `docker compose up`: bulk-ingests and
  # embeds the full Wikipedia corpus into pgvector. Unlike `seed` (a committed
  # subset, no key), this calls the paid Voyage embedding API and is long, so it
  # runs only on demand and the backend never waits for it:
  #   docker compose --profile wiki run --rm wiki-populate
  # Each run is time-boxed by WIKI_MAX_DURATION (default 15m) and stops cleanly
  # at the budget; the embedded prefix is committed and re-running resumes. The
  # corpus only goes live (atomic swap) once a run finishes the whole embed. The
  # downloaded dump lives in a named volume so resumes reuse it. Override with
  # WIKI_MAX_DURATION (0 = run to completion) and WIKI_CORPUS (default simplewiki).
  wiki-populate:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command:
      - "go"
      - "run"
      - "./cmd/wikisync"
      - "-mode=bulk"
      - "-max-duration=${WIKI_MAX_DURATION:-15m}"
      - "-dir=/wiki-dump"
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Required for the real embed run; the program fails fast if unset.
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
      - wiki-dump:/wiki-dump
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Object storage for uploaded video. Local mirror of the production S3 bucket;
  # the backend talks to both through one storage abstraction selected by config
  # (STORAGE_* env). Console on :9001, S3 API on :9000.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      # Dev-only root credentials; production uses the ECS task role, no keys.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, then creates the media bucket and exits.
  # Idempotent (mc mb --ignore-existing), so repeated up cycles are safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio'; sleep 1;
        done
        mc mb --ignore-existing local/media

  backend:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    environment:
      PORT: "8080"
      # Dev-only credentials; production DATABASE_URL comes from Secrets Manager.
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # From the root .env (see .env.example); the server fails fast if unset.
      TRANSCRIPTION_API_KEY: "${TRANSCRIPTION_API_KEY:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # No CORS origin: the browser talks to the API same-origin through the
      # frontend proxy so the SameSite=Strict session cookie can ride along.
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Local dev runs over plain HTTP, so the session cookie cannot be Secure.
      AUTH_INSECURE_COOKIE: "true"
      # Object storage points at the local MinIO container (path-style, static
      # dev credentials). Production uses the ECS task role, an empty endpoint,
      # and virtual-hosted addressing. Consumed by the upload API.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      # The browser issues the presigned playback GET and upload PUT directly, so
      # those URLs are signed against the host-published MinIO address it can
      # reach (localhost:9000), not the Docker-internal STORAGE_ENDPOINT. Empty in
      # production, where the real S3 URL is already browser-reachable.
      STORAGE_PUBLIC_ENDPOINT: "http://localhost:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
      # YouTube ingest (POST /api/videos/youtube). The dev image bundles a pinned
      # yt-dlp and ffmpeg, so the defaults work as-is. Optional overrides:
      # YOUTUBE_DOWNLOADER_PATH (default "yt-dlp"), YOUTUBE_MAX_DOWNLOAD_BYTES
      # (default 2 GiB), YOUTUBE_DOWNLOAD_TIMEOUT (default 15m).
    ports:
      - "8080:8080"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side rewrite target for the same-origin /api proxy. The
      # browser must never call the backend cross-origin: the session cookie
      # is SameSite=Strict and only rides same-origin /api requests.
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./stack/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  go-mod-cache:
  frontend-node-modules:
  pgdata:
  minio-data:
  wiki-dump:
