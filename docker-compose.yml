# Local development. Source is bind-mounted and dev servers run with hot reload.
# Production images are built from stack/*/Dockerfile (used by the deploy workflow).
services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker defaults /dev/shm to 64MB; the parallel HNSW index build for the
    # bulk Wikipedia corpus needs hundreds of MB of shared memory, so raise it
    # to avoid "could not resize shared memory segment ... No space left on
    # device" (SQLSTATE 53100) during wiki-populate's finalize step.
    shm_size: "2gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: truthinstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truthinstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the golang-migrate up migrations, then exits. The backend
  # waits for it so the schema exists before the API starts.
  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      - "up"
    volumes:
      - ./stack/backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: loads the local dataset - curated claims, the Wikipedia evidence
  # subset, the precomputed demo-video results, and the curated sample video
  # gallery (records plus best-effort media) - into pgvector and object storage,
  # then exits. Idempotent (everything upserts by id/object key). Embeddings come
  # from the committed cache (stack/backend/seed/embeddings.cache.jsonl), keyed
  # under the default model (voyage-4-large); seeding is strictly offline and
  # never calls Voyage, so a stray or invalid EMBEDDING_API_KEY can never break
  # it. A cache miss is a hard error (a fixture changed, or EMBEDDING_MODEL no
  # longer matches the cache) - rebuild with `make refresh-embeddings`, which is
  # the only path that uses EMBEDDING_API_KEY. Sample media is fetched once from SAMPLE_VIDEO_URL
  # (default a public test clip) and cached under seed/media-cache (bind-mounted,
  # so it survives reseeds); an unreachable host with no cache seeds the records
  # without media rather than failing. The backend waits for this so the stores
  # and gallery are populated before the first request - no restart needed.
  seed:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/seed"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Object storage for the sample-video media; mirrors the backend's STORAGE_*
      # so seeded samples upload to the same MinIO bucket the API serves from.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
      # Media bytes for the curated sample. Empty falls back to the binary default
      # (a public BigBuckBunny clip). Sample videos stream live through the
      # AssemblyAI pipeline when played, so any clip produces fact-checks; point
      # this at a clip whose claims overlap the seeded corpus for the best verdicts.
      SAMPLE_VIDEO_URL: "${SAMPLE_VIDEO_URL:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large: 1024 dims, and its batch endpoint works where base
      # voyage-4's currently hangs). Override only with another 1024-dim Voyage
      # model, and note the committed seed cache is keyed under the default - a
      # different model needs `make refresh-embeddings` to rebuild it.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Opt-in (profile "tools"), not part of `docker compose up`: bulk-ingests the
  # full Wikipedia corpus into pgvector and publishes one prioritized embedding
  # job per chunk to the broker. The worker fleet (embedworker) drains the queue
  # and calls the paid Voyage API; the corpus only goes live (atomic swap) once
  # the fleet has embedded every chunk. This is the producer half of the pipeline,
  # so it needs the broker and at least one worker running - start them, then run
  # the producer:
  #   docker compose --profile wiki up -d --scale embedworker=4 rabbitmq embedworker
  #   docker compose --profile tools run --rm wiki-populate
  # Embedding throughput scales with the worker replica count, not with this
  # process - that is what makes a large corpus (e.g. enwiki) feasible: raise
  # --scale embedworker, do not tune a single embed loop. Each run goes to
  # completion by default (WIKI_MAX_DURATION=0); set it to box a session, e.g.
  # 15m, and the run stops cleanly with its embedded prefix committed so a re-run
  # re-enqueues only the still-unembedded chunks. The downloaded dump lives in a
  # named volume and is reused across runs. Override WIKI_MAX_DURATION and
  # WIKI_CORPUS (default simplewiki) via .env or the shell.
  wiki-populate:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command:
      - "go"
      - "run"
      - "./cmd/wikisync"
      - "-mode=bulk"
      # 0 runs to completion (resumable across runs); set WIKI_MAX_DURATION to
      # box a single session, e.g. 15m.
      - "-max-duration=${WIKI_MAX_DURATION:-0}"
      - "-dir=/wiki-dump"
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Bulk (the default) publishes jobs to the broker and the worker fleet does
      # the embedding, so it needs no Voyage key. Delta (`make wiki-update`) reuses
      # this service with -mode=delta and still embeds inline, so it needs the
      # Voyage key, model, and embed tuning below; bulk ignores them.
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large, 1024 dims). A different 1024-dim model needs
      # `make refresh-embeddings` to rebuild the committed seed cache.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
      # Producer tuning (optional; empty uses the binary defaults).
      # WIKI_ENQUEUE_BATCH_SIZE is the page size while publishing. The default
      # bulk-into-live ingest publishes and exits (the fleet fills the live corpus
      # in place, no swap). WIKI_DRAIN_POLL_INTERVAL/WIKI_DRAIN_STALL_TIMEOUT bound
      # the fleet-drain wait only on an -atomic build, which aborts if the remaining
      # count stalls for the timeout so a dead fleet cannot hang the swap.
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
      WIKI_DRAIN_POLL_INTERVAL: "${WIKI_DRAIN_POLL_INTERVAL:-}"
      WIKI_DRAIN_STALL_TIMEOUT: "${WIKI_DRAIN_STALL_TIMEOUT:-}"
      # Inline-embed tuning for the delta path (`make wiki-update`); bulk ignores
      # these. A constrained Voyage tier completes with gentle defaults; raise the
      # batch and concurrency on a higher tier. WIKI_EMBED_RPM caps outbound
      # requests per minute (0 = unpaced). The free tier cannot embed a full
      # corpus in any reasonable time; a paid tier is required.
      WIKI_EMBED_HTTP_TIMEOUT: "${WIKI_EMBED_HTTP_TIMEOUT:-300s}"
      WIKI_EMBED_BATCH_SIZE: "${WIKI_EMBED_BATCH_SIZE:-32}"
      WIKI_EMBED_CONCURRENCY: "${WIKI_EMBED_CONCURRENCY:-2}"
      WIKI_EMBED_RPM: "${WIKI_EMBED_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
      - wiki-dump:/wiki-dump
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # No depends_on the worker fleet: the producer publishes to the durable broker
      # and is decoupled from the consumers (the queue holds the jobs until a worker
      # drains them), and the embedworker fleet lives in the "wiki" profile while
      # this one-shot is in "tools". `make wiki-populate` brings up a worker
      # explicitly before publishing; scale it with `make fleet-up EMBEDWORKER_REPLICAS=N`.

  # Opt-in (profile "tools"), not part of `docker compose up`: fetches the curated
  # statistical series (Eurostat + interior-ministry CSV + INSEE), renders each
  # observation into a French evidence passage, upserts it un-embedded into the live
  # wiki_chunks table, and publishes one prioritized embedding job per passage to the
  # broker. The same embedworker fleet that drains the Wikipedia queue fills these
  # vectors in place (bulk-into-live, no inline Voyage call), so a broad sweep scales
  # by worker replica count rather than one synchronous embed burst. It is the
  # producer half of the pipeline, so it needs the broker and at least one worker
  # running - `make stats-ingest` brings up a single worker if none is, or reuses a
  # fleet from `make fleet-up EMBEDWORKER_REPLICAS=N`. Idempotent on the (series,
  # period) provenance key; a re-run refreshes the figures and republishes only the
  # still-unembedded passages.
  stats-ingest:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/statsingest"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Embedding now happens in the fleet, so this producer needs no Voyage key -
      # only the broker. The worker fleet holds the embedding key.
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Producer tuning (optional; empty uses the binary defaults).
      # WIKI_ENQUEUE_BATCH_SIZE is the publish page size, shared with wiki-populate.
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
      # Optional INSEE BDM key; the curated INSEE series resolve without it.
      INSEE_API_KEY: "${INSEE_API_KEY:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # No depends_on the worker fleet, for the same reason wiki-populate omits it:
      # the producer publishes to the durable broker and the fleet drains it. `make
      # stats-ingest` brings up a worker explicitly before publishing.

  # Object storage for uploaded video. Local mirror of the production S3 bucket;
  # the backend talks to both through one storage abstraction selected by config
  # (STORAGE_* env). Console on :9001, S3 API on :9000.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      # Dev-only root credentials; production uses the ECS task role, no keys.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, then creates the media bucket and exits.
  # Idempotent (mc mb --ignore-existing), so repeated up cycles are safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio'; sleep 1;
        done
        mc mb --ignore-existing local/media

  # Message broker for the embedding-job queue. The producer (wiki ingest) will
  # publish prioritized embedding jobs and the worker fleet will drain them; this
  # is the local mirror of the production Amazon MQ for RabbitMQ broker, selected
  # by config (RABBITMQ_URL). 3.13 matches the managed broker's engine line. The
  # default user is loopback-only, so dev credentials are set to allow the other
  # containers (a non-loopback source) to connect. Management UI on :15672, AMQP
  # on :5672.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # Dev-only credentials; production uses Amazon MQ with a Secrets Manager
      # password and never these defaults.
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Embedding worker fleet. Drains prioritized embedding jobs from the broker,
  # embeds a batch of chunks per Voyage call, and writes the vectors back in
  # place - into the live corpus by default (bulk-into-live), or the staging table
  # for an -atomic build; higher-priority chunks are embedded first. Local mirror of
  # the production worker service and scales horizontally - run several replicas
  # with `docker compose --profile wiki up --scale embedworker=4`. It lives under
  # the "wiki" profile because the corpus ingest is what publishes its jobs, so a
  # plain `up` does not start an idle worker. No container_name, so the service
  # can scale.
  embedworker:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/embedworker"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required for a real embed run; the worker fails fast if unset.
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Must match the ingest/query model everywhere or similarity is meaningless;
      # empty falls back to the binary default (voyage-4-large, 1024 dims).
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # Per-replica tuning. Concurrency bounds the parallel embeds one replica
      # runs (the fleet scales by replica count); MAX_ATTEMPTS is the per-job
      # delivery budget before a persistent failure is dropped with a log; RPM
      # caps outbound Voyage requests per minute (0 = unpaced) for a constrained
      # tier. A shell or .env value overrides each default.
      EMBED_WORKER_CONCURRENCY: "${EMBED_WORKER_CONCURRENCY:-4}"
      EMBED_WORKER_MAX_ATTEMPTS: "${EMBED_WORKER_MAX_ATTEMPTS:-5}"
      EMBED_WORKER_RPM: "${EMBED_WORKER_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # crawlworker drains self-contained category-crawl chunk jobs into live
  # wiki_chunks, additive to whatever the dump pipeline wrote. It mirrors
  # embedworker but writes whole chunks (content + vector). Scale it like the
  # embed fleet:
  #   docker compose --profile wiki up -d --scale crawlworker=4 rabbitmq crawlworker
  crawlworker:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/crawlworker"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required for a real embed run; the worker fails fast if unset.
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Must match the ingest/query model everywhere or similarity is meaningless;
      # empty falls back to the binary default (voyage-4-large, 1024 dims).
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # Per-replica tuning. Concurrency bounds the parallel embeds one replica
      # runs (the fleet scales by replica count); MAX_ATTEMPTS is the per-job
      # delivery budget before a persistent failure is dropped with a log; RPM
      # caps outbound Voyage requests per minute (0 = unpaced) for a constrained
      # tier. A shell or .env value overrides each default.
      CRAWL_WORKER_CONCURRENCY: "${CRAWL_WORKER_CONCURRENCY:-4}"
      CRAWL_WORKER_MAX_ATTEMPTS: "${CRAWL_WORKER_MAX_ATTEMPTS:-5}"
      CRAWL_WORKER_RPM: "${CRAWL_WORKER_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # wikicrawl walks the configured categories over the MediaWiki Action API and
  # fills the crawl queue with self-contained chunk jobs, then exits. It needs no
  # database. This is the on-demand producer (re-crawl a different slice); it lives
  # in the "tools" profile and is run explicitly, never auto-started:
  #   docker compose --profile tools run --rm wikicrawl   (or: make crawl)
  # The wiki-prime service below reuses this exact config (YAML merge) to auto-prime
  # the broker on `docker compose --profile wiki up`.
  wikicrawl: &wikicrawl
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikicrawl"]
    environment:
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required: comma-separated category titles, e.g. "Category:Climate change".
      CRAWL_CATEGORIES: "${CRAWL_CATEGORIES:-}"
      # Wiki project queried and used to build article URLs; empty falls back to
      # WIKI_CORPUS. CRAWL_CORPUS is the provenance tag (empty = <project>-crawl).
      CRAWL_PROJECT: "${CRAWL_PROJECT:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
      CRAWL_CORPUS: "${CRAWL_CORPUS:-}"
      # Crawl shape (empty uses the binary defaults: depth 1, 5000 pages, body on).
      CRAWL_MAX_DEPTH: "${CRAWL_MAX_DEPTH:-}"
      CRAWL_MAX_PAGES: "${CRAWL_MAX_PAGES:-}"
      CRAWL_INCLUDE_BODY: "${CRAWL_INCLUDE_BODY:-}"
      # Category sharding (empty/1 = single producer over the whole list). `make
      # crawl CRAWL_SHARDS=N` overrides these per container so N parallel producers
      # each crawl a disjoint round-robin slice of CRAWL_CATEGORIES.
      CRAWL_SHARDS: "${CRAWL_SHARDS:-}"
      CRAWL_SHARD_INDEX: "${CRAWL_SHARD_INDEX:-}"
      # Fact-checkability gate: on by default, so a key is required unless you set
      # CRAWL_CHECKWORTHY=false to publish every chunk. The gate drops chunks that
      # are not citable evidence before they reach the broker; gate errors fail
      # open (the chunk is published). CONCURRENCY caps in-flight judgments;
      # RPM (empty/0 = unpaced) caps the Anthropic call rate.
      CRAWL_CHECKWORTHY: "${CRAWL_CHECKWORTHY:-}"
      CHECKWORTHY_API_KEY: "${CHECKWORTHY_API_KEY:-}"
      CRAWL_CHECKWORTHY_MODEL: "${CRAWL_CHECKWORTHY_MODEL:-}"
      CRAWL_CHECKWORTHY_CONCURRENCY: "${CRAWL_CHECKWORTHY_CONCURRENCY:-}"
      CRAWL_CHECKWORTHY_RPM: "${CRAWL_CHECKWORTHY_RPM:-}"
      # LLM provider for the fact-checkability gate (default deepseek, keyed on
      # DEEPSEEK_API_KEY). Set LLM_PROVIDER=anthropic to use Claude, or
      # LLM_PROVIDER=gemini + GEMINI_API_KEY to route the gate to Google Gemini.
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      rabbitmq:
        condition: service_healthy

  # wiki-prime auto-primes the broker on `docker compose --profile wiki up`: it runs
  # the crawler once against CRAWL_CATEGORIES, then exits (restart: "no"), so an
  # operator who brings up the paid "wiki" profile gets a queue already filling with
  # fact-checkable chunk jobs - the crawlworker fleet (also in "wiki") drains it. It
  # reuses the wikicrawl config above verbatim (same command, env, broker dep); only
  # the profile and restart policy differ. A plain `make up` (no profile) never
  # starts it, preserving the cost-safety rule. CRAWL_CATEGORIES must be set (in
  # .env) or the run fails fast, exactly like the on-demand producer.
  wiki-prime:
    <<: *wikicrawl
    profiles: ["wiki"]
    restart: "no"

  # factcheckworker drains self-contained curated-claim jobs from the fact-check
  # queue, embeds each claim's text, and upserts the political claim record
  # (text + verdict + flags + source + vector) into the political claim DB. It
  # mirrors crawlworker but writes a curated claim instead of a wiki chunk and
  # reuses the same CRAWL_WORKER_* tuning. Scale it like the embed fleet:
  #   docker compose --profile factcheck up -d --scale factcheckworker=4 rabbitmq factcheckworker
  factcheckworker:
    profiles: ["factcheck"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/factcheckworker"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required for a real embed run; the worker fails fast if unset.
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # Per-replica tuning, shared with the wiki crawl worker.
      CRAWL_WORKER_CONCURRENCY: "${CRAWL_WORKER_CONCURRENCY:-4}"
      CRAWL_WORKER_MAX_ATTEMPTS: "${CRAWL_WORKER_MAX_ATTEMPTS:-5}"
      CRAWL_WORKER_RPM: "${CRAWL_WORKER_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # factcheckcrawl reads already-checked French claims from the Google Fact Check
  # Tools API (the standardized ClaimReview aggregator for Les Decodeurs, AFP
  # Factuel, franceinfo Vrai ou Fake) and fills the fact-check queue with
  # self-contained curated-claim jobs, then exits. It needs no database. On-demand
  # producer (run explicitly), in the "tools" profile:
  #   docker compose --profile tools run --rm factcheckcrawl   (or: make factcheck-crawl)
  factcheckcrawl:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/factcheckcrawl"]
    environment:
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required: the Google Fact Check Tools API key and comma-separated query
      # terms (a politician's name, a policy area) to walk. The producer follows
      # nextPageToken to the end of each query unless FACTCHECK_MAX_PAGES caps it.
      FACTCHECK_API_KEY: "${FACTCHECK_API_KEY:-}"
      FACTCHECK_QUERIES: "${FACTCHECK_QUERIES:-}"
      # Claim language filter (default fr) and per-query page cap (empty/0 = all).
      FACTCHECK_LANGUAGE: "${FACTCHECK_LANGUAGE:-}"
      FACTCHECK_MAX_PAGES: "${FACTCHECK_MAX_PAGES:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      rabbitmq:
        condition: service_healthy

  # scrutinsworker drains self-contained scrutin jobs from the scrutins queue,
  # parses each scrutin's raw AN open-data JSON into per-deputy voting records,
  # and upserts them into the voting store (keyed by person+scrutin, idempotent).
  # It mirrors factcheckworker but writes voting records and never embeds, so it
  # needs no Voyage key. Scale it like the other fleets:
  #   docker compose --profile scrutins up -d --scale scrutinsworker=4 rabbitmq scrutinsworker
  scrutinsworker:
    profiles: ["scrutins"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/scrutinsworker"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Per-replica tuning (the fleet scales by replica count). CONCURRENCY bounds
      # the scrutins parsed/upserted in parallel; MAX_ATTEMPTS is the per-job
      # delivery budget before a persistent failure is dropped with a log.
      SCRUTINS_WORKER_CONCURRENCY: "${SCRUTINS_WORKER_CONCURRENCY:-4}"
      SCRUTINS_WORKER_MAX_ATTEMPTS: "${SCRUTINS_WORKER_MAX_ATTEMPTS:-5}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # scrutinscrawl conditionally downloads the Assemblee Nationale open-data
  # Scrutins.json.zip archive (Etalab Licence Ouverte 2.0, attribution "Assemblee
  # nationale - data.assemblee-nationale.fr"), discovers each scrutin, and
  # publishes one self-contained job to the scrutins queue, then exits. It needs
  # no database. A persisted ETag/Last-Modified marker (under the scrutins-state
  # volume, shared so a re-run sees the last run's validators) makes the download a
  # conditional GET, so an unchanged archive is a 304 and the run does no redundant
  # work. On-demand producer (run explicitly), in the "tools" profile:
  #   docker compose --profile tools run --rm scrutinscrawl   (or: make scrutins-crawl)
  scrutinscrawl:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/scrutinscrawl"]
    environment:
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # AN legislature to ingest (default 17, the current term) and where the
      # conditional-GET marker persists between runs (empty disables the skip, so
      # every run re-downloads). Optional.
      SCRUTINS_LEGISLATURE: "${SCRUTINS_LEGISLATURE:-}"
      SCRUTINS_MARKER_PATH: "${SCRUTINS_MARKER_PATH:-/state/scrutins-marker.json}"
      # Slack incoming-webhook for ingestion-fleet run alerts (start, finish
      # summary, failure). Empty -> the notifier is a silent no-op.
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
      - scrutins-state:/state
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Always-on ingestion-fleet scheduler. Registers the Wikipedia, fact-check, and
  # scrutins producers and fires each on its configurable cron (SCHEDULE_*),
  # replacing the manual `make crawl` / `make factcheck-crawl` / `make
  # scrutins-crawl` one-shot runs: every enabled run publishes into its queue for
  # the worker fleet to drain, an overlapping tick of a source still running is
  # skipped, and each run posts the shared Slack alerts. Every source defaults
  # DISABLED, so a plain `make up` starts an idle scheduler and never kicks off
  # paid ingestion - the same cost-safety convention the paid wiki profiles
  # follow; opt a source in with SCHEDULE_<SOURCE>_ENABLED=true and set its
  # producer config (CRAWL_* / FACTCHECK_* / SCRUTINS_*). It needs only the broker
  # and the scrutins-state volume (the conditional-GET marker), no database.
  # Restarts unless stopped so a crash brings the schedule back; the producers are
  # idempotent (workers upsert), so a restart cannot double-ingest.
  scheduler:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/scheduler"]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Per-source enable flags and cron specs (empty uses the daily defaults).
      SCHEDULE_WIKIPEDIA_ENABLED: "${SCHEDULE_WIKIPEDIA_ENABLED:-}"
      SCHEDULE_WIKIPEDIA_CRON: "${SCHEDULE_WIKIPEDIA_CRON:-}"
      SCHEDULE_FACTCHECK_ENABLED: "${SCHEDULE_FACTCHECK_ENABLED:-}"
      SCHEDULE_FACTCHECK_CRON: "${SCHEDULE_FACTCHECK_CRON:-}"
      SCHEDULE_SCRUTINS_ENABLED: "${SCHEDULE_SCRUTINS_ENABLED:-}"
      SCHEDULE_SCRUTINS_CRON: "${SCHEDULE_SCRUTINS_CRON:-}"
      SCHEDULE_JITTER: "${SCHEDULE_JITTER:-}"
      # Wikipedia producer config (mirrors the wikicrawl service). Required when
      # the Wikipedia source is enabled.
      CRAWL_CATEGORIES: "${CRAWL_CATEGORIES:-}"
      CRAWL_PROJECT: "${CRAWL_PROJECT:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
      CRAWL_CORPUS: "${CRAWL_CORPUS:-}"
      CRAWL_MAX_DEPTH: "${CRAWL_MAX_DEPTH:-}"
      CRAWL_MAX_PAGES: "${CRAWL_MAX_PAGES:-}"
      CRAWL_INCLUDE_BODY: "${CRAWL_INCLUDE_BODY:-}"
      CRAWL_SHARDS: "${CRAWL_SHARDS:-}"
      CRAWL_SHARD_INDEX: "${CRAWL_SHARD_INDEX:-}"
      CRAWL_CHECKWORTHY: "${CRAWL_CHECKWORTHY:-}"
      CHECKWORTHY_API_KEY: "${CHECKWORTHY_API_KEY:-}"
      CRAWL_CHECKWORTHY_MODEL: "${CRAWL_CHECKWORTHY_MODEL:-}"
      CRAWL_CHECKWORTHY_CONCURRENCY: "${CRAWL_CHECKWORTHY_CONCURRENCY:-}"
      CRAWL_CHECKWORTHY_RPM: "${CRAWL_CHECKWORTHY_RPM:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Fact-check producer config (mirrors the factcheckcrawl service). Required
      # when the fact-check source is enabled.
      FACTCHECK_API_KEY: "${FACTCHECK_API_KEY:-}"
      FACTCHECK_QUERIES: "${FACTCHECK_QUERIES:-}"
      FACTCHECK_LANGUAGE: "${FACTCHECK_LANGUAGE:-}"
      FACTCHECK_MAX_PAGES: "${FACTCHECK_MAX_PAGES:-}"
      # Scrutins producer config (mirrors the scrutinscrawl service).
      SCRUTINS_LEGISLATURE: "${SCRUTINS_LEGISLATURE:-}"
      SCRUTINS_MARKER_PATH: "${SCRUTINS_MARKER_PATH:-/state/scrutins-marker.json}"
      # Slack incoming-webhook for ingestion-fleet run alerts. Empty -> silent no-op.
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
      - scrutins-state:/state
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Offline topic-clustering job. Groups the embedded corpus into topic clusters
  # and scores each chunk's importance, writing cluster_id + importance back so
  # the next ingest's producer embeds the most important content first. Opt-in
  # (profile "tools"), one-shot, no API key: it reads existing embeddings and
  # writes scores. Run it after a corpus is embedded; re-running it over an
  # unchanged corpus is idempotent (the clustering is deterministically seeded):
  #   docker compose --profile tools run --rm wiki-cluster
  # WIKI_CLUSTER_* tunes the cluster count (raise WIKI_CLUSTER_K for a larger
  # corpus), iterations, seed, and batch sizes.
  wiki-cluster:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikicluster"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Optional clustering tuning (empty uses the binary defaults).
      WIKI_CLUSTER_K: "${WIKI_CLUSTER_K:-}"
      WIKI_CLUSTER_MAX_ITERS: "${WIKI_CLUSTER_MAX_ITERS:-}"
      WIKI_CLUSTER_SEED: "${WIKI_CLUSTER_SEED:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Clears the live corpus and its sync checkpoint so the next bulk run rebuilds
  # from scratch under the current code - the first step of `make reingest`. The
  # checkpoint keys on the dump version, not the code, so this is what forces a
  # rebuild after the chunker or metadata changed. Opt-in (profile "tools"),
  # one-shot, no broker or API key: it only touches the database, so it depends on
  # postgres + migrate alone (not the broker or object storage).
  wiki-reset:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikisync", "-mode=reset"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Verifies the rebuilt corpus is complete and servable: chunks present, every
  # chunk embedded with a non-null, non-zero, 1024-dim vector, metadata populated,
  # and the HNSW index live. The last step of `make reingest`; it exits non-zero
  # and logs the failing checks if the corpus is incomplete or stale, so a partial
  # rebuild is caught rather than served. Opt-in (profile "tools"), one-shot, no API
  # key.
  wiki-verify:
    profiles: ["tools"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikiverify"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Analysis cache. Local mirror of the production managed Valkey cache, selected by
  # config (REDIS_URL). go-redis speaks a wire protocol both Redis OSS and Valkey
  # serve, so the same backend client drives this dev container and prod Valkey with
  # no engine-specific code. redis:8-alpine is the current stable line; the cache is
  # an ephemeral replay accelerator (TTL-bounded, rebuildable by re-analysis), so it
  # runs with no persistent volume - a restart simply starts cold.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    environment:
      PORT: "8080"
      # Dev-only credentials; production DATABASE_URL comes from Secrets Manager.
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Analysis cache. Points at the local redis container; production sets this to
      # the managed Valkey endpoint. Empty disables caching and the backend falls back
      # to the no-op cache, behaving exactly as it does today. ANALYSIS_CACHE_TTL
      # bounds the cached-analysis lifetime (default 24h). REDIS_URL is never logged.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      ANALYSIS_CACHE_TTL: "${ANALYSIS_CACHE_TTL:-}"
      # AssemblyAI API key from the root .env (see .env.example); the sole
      # transcriber (Universal-3 Pro streaming) for both live streams and
      # imported videos. The server fails fast if unset. Optional tuning falls
      # back to the binary defaults when empty: TRANSCRIPTION_MODEL (u3-rt-pro)
      # and TRANSCRIPTION_MAX_SPEAKERS (provider-decided).
      TRANSCRIPTION_API_KEY: "${TRANSCRIPTION_API_KEY:-}"
      TRANSCRIPTION_MODEL: "${TRANSCRIPTION_MODEL:-}"
      TRANSCRIPTION_MAX_SPEAKERS: "${TRANSCRIPTION_MAX_SPEAKERS:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large: 1024 dims, and its batch endpoint works where base
      # voyage-4's currently hangs). Override only with another 1024-dim Voyage
      # model, and note the committed seed cache is keyed under the default - a
      # different model needs `make refresh-embeddings` to rebuild it.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # LLM provider for every LLM-backed stage (consistency, check-worthiness,
      # claim decomposition, claim typing, the credibility verifier). Defaults to
      # deepseek (DeepSeek's cheap chat model, keyed on DEEPSEEK_API_KEY). Set
      # LLM_PROVIDER=anthropic for Claude Haiku, or LLM_PROVIDER=gemini +
      # GEMINI_API_KEY to route the same forced-tool calls to Google Gemini; an
      # unknown value fails fast at startup. The per-stage *_MODEL and Anthropic
      # *_API_KEY vars still apply.
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Live intra-speaker consistency: flag when a speaker contradicts their own
      # earlier statement. Off unless CONSISTENCY_ENABLED is true AND
      # CONSISTENCY_API_KEY (Anthropic) is set; with no key, live analysis behaves
      # exactly as before. Optional tuning falls back to binary defaults when
      # empty: CONSISTENCY_MODEL (claude-haiku-4-5-20251001), CONSISTENCY_TOP_K
      # (3), CONSISTENCY_SIMILARITY_FLOOR (0.6).
      CONSISTENCY_ENABLED: "${CONSISTENCY_ENABLED:-}"
      CONSISTENCY_API_KEY: "${CONSISTENCY_API_KEY:-}"
      CONSISTENCY_MODEL: "${CONSISTENCY_MODEL:-}"
      CONSISTENCY_TOP_K: "${CONSISTENCY_TOP_K:-}"
      CONSISTENCY_SIMILARITY_FLOOR: "${CONSISTENCY_SIMILARITY_FLOOR:-}"
      # Model check-worthiness classifier: upgrade the precheck gate's first stage
      # so casual or personal declaratives are skipped, not fact-checked. Off
      # unless CHECKWORTHINESS_ENABLED is true AND CHECKWORTHINESS_API_KEY
      # (Anthropic) is set; with no key, the heuristic alone decides, exactly as
      # before. CHECKWORTHINESS_MODEL falls back to claude-haiku-4-5-20251001.
      CHECKWORTHINESS_ENABLED: "${CHECKWORTHINESS_ENABLED:-}"
      CHECKWORTHINESS_API_KEY: "${CHECKWORTHINESS_API_KEY:-}"
      CHECKWORTHINESS_MODEL: "${CHECKWORTHINESS_MODEL:-}"
      # Retrieve-then-verify fact-check path: decompose each unit into atomic
      # claims, retrieve evidence, and have an LLM verifier derive the verdict
      # (supports/refutes/not_enough_info) from that evidence instead of borrowing
      # a curated near-match by similarity. Off unless FACTCHECK_VERIFY_PATH is
      # true AND FACTCHECK_VERIFY_API_KEY (Anthropic) is set; with no key it
      # degrades to the legacy gate-and-match path. Optional tuning falls back to
      # binary defaults when empty: FACTCHECK_VERIFY_MODEL (claude-haiku-4-5-20251001),
      # FACTCHECK_VERIFY_MAX_CLAIMS_PER_UNIT (4), FACTCHECK_VERIFY_FAST_TAU (0.85),
      # FACTCHECK_VERIFY_RETRIEVAL_THRESHOLD (0.45 - the recall floor for evidence
      # fed to the verifier; lower than the legacy 0.6 borrow threshold so the
      # on-topic band is retrieved instead of short-circuiting to not_enough_info),
      # FACTCHECK_VERIFY_CONCURRENCY (2), FACTCHECK_VERIFY_QUEUE_DEPTH (4),
      # FACTCHECK_VERIFY_FAST_DEADLINE (800ms), FACTCHECK_VERIFY_DEADLINE (4s),
      # FACTCHECK_VERIFY_CACHE_TTL (30s).
      FACTCHECK_VERIFY_PATH: "${FACTCHECK_VERIFY_PATH:-}"
      FACTCHECK_VERIFY_API_KEY: "${FACTCHECK_VERIFY_API_KEY:-}"
      FACTCHECK_VERIFY_MODEL: "${FACTCHECK_VERIFY_MODEL:-}"
      FACTCHECK_VERIFY_MAX_CLAIMS_PER_UNIT: "${FACTCHECK_VERIFY_MAX_CLAIMS_PER_UNIT:-}"
      FACTCHECK_VERIFY_FAST_TAU: "${FACTCHECK_VERIFY_FAST_TAU:-}"
      FACTCHECK_VERIFY_RETRIEVAL_THRESHOLD: "${FACTCHECK_VERIFY_RETRIEVAL_THRESHOLD:-}"
      FACTCHECK_VERIFY_CONCURRENCY: "${FACTCHECK_VERIFY_CONCURRENCY:-}"
      FACTCHECK_VERIFY_QUEUE_DEPTH: "${FACTCHECK_VERIFY_QUEUE_DEPTH:-}"
      FACTCHECK_VERIFY_FAST_DEADLINE: "${FACTCHECK_VERIFY_FAST_DEADLINE:-}"
      FACTCHECK_VERIFY_DEADLINE: "${FACTCHECK_VERIFY_DEADLINE:-}"
      FACTCHECK_VERIFY_CACHE_TTL: "${FACTCHECK_VERIFY_CACHE_TTL:-}"
      # Deeper-reasoner second pass: after the verify path returns an evidence-grounded
      # verdict whose confidence sits in a mid band, a stronger reasoning model
      # re-judges the same evidence and may upgrade the verdict in place. It runs off
      # the live hot path (after the fast verdict is emitted, outside the verify pool)
      # and never lifts a knowledge-only verdict past the confidence cap. Off unless
      # FACTCHECK_SECOND_PASS is true AND FACTCHECK_SECOND_PASS_API_KEY (Anthropic) or
      # the selected provider's key is set; with no key it degrades to the single-pass
      # verify path. Only the credibility-only verify stage runs it (political mode owns
      # its own verify stage). Optional tuning falls back to defaults when empty:
      # FACTCHECK_SECOND_PASS_MODEL (deepseek-v4-pro under DeepSeek - the larger,
      # costlier reasoning tier), FACTCHECK_SECOND_PASS_BAND_LO (0.45) /
      # FACTCHECK_SECOND_PASS_BAND_HI (0.8) bound the qualifying confidence band, and
      # FACTCHECK_SECOND_PASS_DEADLINE (12s) bounds one reverify call.
      FACTCHECK_SECOND_PASS: "${FACTCHECK_SECOND_PASS:-}"
      FACTCHECK_SECOND_PASS_API_KEY: "${FACTCHECK_SECOND_PASS_API_KEY:-}"
      FACTCHECK_SECOND_PASS_MODEL: "${FACTCHECK_SECOND_PASS_MODEL:-}"
      FACTCHECK_SECOND_PASS_BAND_LO: "${FACTCHECK_SECOND_PASS_BAND_LO:-}"
      FACTCHECK_SECOND_PASS_BAND_HI: "${FACTCHECK_SECOND_PASS_BAND_HI:-}"
      FACTCHECK_SECOND_PASS_DEADLINE: "${FACTCHECK_SECOND_PASS_DEADLINE:-}"
      # French/EU political fact-checking mode. Off by default; when true the live
      # transcription biases toward French (language_code=fr) and the gate and
      # claim decomposition prompt and reason in French. When it is on AND the
      # verify path is active (FACTCHECK_VERIFY_PATH + key), the per-claim verify
      # stage switches to the political pipeline: each claim is classified, routed
      # to its authoritative source (stats / voting / press) and broadened to web
      # search, then judged on two axes (literal verdict + manipulation flags), and
      # folded into a flag-aware per-speaker score. With it off the verify path runs
      # its credibility-only stage unchanged. Read at startup, so recreate the
      # backend after changing it. FACTCHECK_POLITICAL_ROUTER_MIN_RESULTS (default 1)
      # is the thin-result floor below which the router broadens to web search.
      FACTCHECK_POLITICAL: "${FACTCHECK_POLITICAL:-}"
      FACTCHECK_POLITICAL_ROUTER_MIN_RESULTS: "${FACTCHECK_POLITICAL_ROUTER_MIN_RESULTS:-}"
      # Political source packs (read only when FACTCHECK_POLITICAL is on). Web search
      # is the mandatory open-ended fallback, so WEBSEARCH_API_KEY (a Brave token) is
      # required in political mode; the press pack joins only when PRESS_API_KEY is
      # set, and the stats pack is keyless (optional STATS_TIMEOUT / STATS_CACHE_TTL
      # tuning only). Secrets are never logged.
      WEBSEARCH_API_KEY: "${WEBSEARCH_API_KEY:-}"
      WEBSEARCH_TIMEOUT: "${WEBSEARCH_TIMEOUT:-}"
      PRESS_API_KEY: "${PRESS_API_KEY:-}"
      PRESS_TIMEOUT: "${PRESS_TIMEOUT:-}"
      STATS_TIMEOUT: "${STATS_TIMEOUT:-}"
      STATS_CACHE_TTL: "${STATS_CACHE_TTL:-}"
      # The browser's real origin. HTTP /api rides the same-origin frontend proxy
      # so the SameSite=Strict cookie rides along, but the live WebSocket upgrade
      # carries Origin: http://localhost:3000 while the proxy rewrites Host to the
      # backend - a mismatch coder/websocket rejects with 403 unless the origin is
      # allow-listed. This both seeds that allow-list and reflects the CORS header;
      # neither affects the same-origin cookie flow. Empty in prod (the ALB keeps
      # Host, so Origin == Host and same-origin is enforced).
      CORS_ALLOWED_ORIGIN: "http://localhost:3000"
      # Dev-only debug search bar: exposes a WebSocket probe over the embedded
      # wiki corpus at /api/debug/wiki-search and renders the bar in the web UI.
      # Unset in production, where the route is never registered.
      DEBUG_WIKI_SEARCH: "true"
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Local dev runs over plain HTTP, so the session cookie cannot be Secure.
      AUTH_INSECURE_COOKIE: "true"
      # Object storage points at the local MinIO container (path-style, static
      # dev credentials). Production uses the ECS task role, an empty endpoint,
      # and virtual-hosted addressing. Consumed by the upload API.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      # The browser issues the presigned playback GET and upload PUT directly, so
      # those URLs are signed against the host-published MinIO address it can
      # reach (localhost:9000), not the Docker-internal STORAGE_ENDPOINT. Empty in
      # production, where the real S3 URL is already browser-reachable.
      STORAGE_PUBLIC_ENDPOINT: "http://localhost:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
      # YouTube ingest (POST /api/videos/youtube). The dev image bundles a pinned
      # yt-dlp and ffmpeg, so the defaults work as-is. Optional overrides:
      # YOUTUBE_DOWNLOADER_PATH (default "yt-dlp"), YOUTUBE_MAX_DOWNLOAD_BYTES
      # (default 2 GiB), YOUTUBE_DOWNLOAD_TIMEOUT (default 15m).
    ports:
      - "8080:8080"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side rewrite target for the same-origin /api proxy. The
      # browser must never call the backend cross-origin: the session cookie
      # is SameSite=Strict and only rides same-origin /api requests.
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./stack/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  # Local identity provider: imports stack/keycloak/realm.json on start (read-only
  # mount) so the dev stack carries the same realm shape the operator manages in
  # production. `start-dev --import-realm` runs the dev profile (HTTP, ephemeral H2)
  # and is import-idempotent (an existing realm is skipped). Local-dev credentials
  # only; no real secret is committed. The realm shape, the local/production split,
  # and the issuer the backend and frontend validate are documented in
  # docs/configuration.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin for the master realm's admin console (dev only). Production
      # uses the operator's own admin, set out of band and never these defaults.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Published on :8081 with a matching internal port so the issuer the backend
      # and browser validate (http://localhost:8081/realms/truth-in-stream) is the
      # same string Keycloak advertises in its OIDC discovery document.
      KC_HTTP_PORT: "8081"
      # Enables the management /health endpoints (on :9000) the healthcheck probes.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./stack/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image ships no curl, so use Keycloak's own documented container probe:
      # a HEAD request to the management /health/ready endpoint over a bash TCP
      # redirect (KC_HEALTH_ENABLED exposes it on :9000). retries + start_period
      # absorb the startup window before the management listener binds.
      test:
        [
          "CMD-SHELL",
          "(printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200';) 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  go-mod-cache:
  frontend-node-modules:
  pgdata:
  minio-data:
  wiki-dump:
  rabbitmq-data:
  # Persists the scrutins-archive conditional-GET marker (ETag/Last-Modified)
  # across producer runs, so an unchanged archive is skipped.
  scrutins-state:
