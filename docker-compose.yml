# Local development. Source is bind-mounted and dev servers run with hot reload.
# Production images are built from stack/*/Dockerfile (used by the deploy workflow).
services:
  postgres:
    image: pgvector/pgvector:pg16
    # Docker defaults /dev/shm to 64MB; the parallel HNSW index build for the
    # bulk Wikipedia corpus needs hundreds of MB of shared memory, so raise it
    # to avoid "could not resize shared memory segment ... No space left on
    # device" (SQLSTATE 53100) during wiki-populate's finalize step.
    shm_size: "2gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: truthinstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truthinstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the golang-migrate up migrations, then exits. The backend
  # waits for it so the schema exists before the API starts.
  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      - "up"
    volumes:
      - ./stack/backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: loads the local dataset - curated claims, the Wikipedia evidence
  # subset, the precomputed demo-video results, and the curated sample video
  # gallery (records plus best-effort media) - into pgvector and object storage,
  # then exits. Idempotent (everything upserts by id/object key). Embeddings come
  # from the committed cache (stack/backend/seed/embeddings.cache.jsonl), keyed
  # under the default model (voyage-4-large); seeding is strictly offline and
  # never calls Voyage, so a stray or invalid EMBEDDING_API_KEY can never break
  # it. A cache miss is a hard error (a fixture changed, or EMBEDDING_MODEL no
  # longer matches the cache) - rebuild with `make refresh-embeddings`, which is
  # the only path that uses EMBEDDING_API_KEY. Sample media is fetched once from SAMPLE_VIDEO_URL
  # (default a public test clip) and cached under seed/media-cache (bind-mounted,
  # so it survives reseeds); an unreachable host with no cache seeds the records
  # without media rather than failing. The backend waits for this so the stores
  # and gallery are populated before the first request - no restart needed.
  seed:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/seed"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Object storage for the sample-video media; mirrors the backend's STORAGE_*
      # so seeded samples upload to the same MinIO bucket the API serves from.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
      # Media bytes for the curated sample. Empty falls back to the binary default
      # (a public BigBuckBunny clip). Sample videos stream live through the
      # AssemblyAI pipeline when played, so any clip produces fact-checks; point
      # this at a clip whose claims overlap the seeded corpus for the best verdicts.
      SAMPLE_VIDEO_URL: "${SAMPLE_VIDEO_URL:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large: 1024 dims, and its batch endpoint works where base
      # voyage-4's currently hangs). Override only with another 1024-dim Voyage
      # model, and note the committed seed cache is keyed under the default - a
      # different model needs `make refresh-embeddings` to rebuild it.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Opt-in (profile "wiki"), not part of `docker compose up`: bulk-ingests the
  # full Wikipedia corpus into pgvector and publishes one prioritized embedding
  # job per chunk to the broker. The worker fleet (embedworker) drains the queue
  # and calls the paid Voyage API; the corpus only goes live (atomic swap) once
  # the fleet has embedded every chunk. This is the producer half of the pipeline,
  # so it needs the broker and at least one worker running - start them, then run
  # the producer:
  #   docker compose --profile wiki up -d --scale embedworker=4 rabbitmq embedworker
  #   docker compose --profile wiki run --rm wiki-populate
  # Embedding throughput scales with the worker replica count, not with this
  # process - that is what makes a large corpus (e.g. enwiki) feasible: raise
  # --scale embedworker, do not tune a single embed loop. Each run goes to
  # completion by default (WIKI_MAX_DURATION=0); set it to box a session, e.g.
  # 15m, and the run stops cleanly with its embedded prefix committed so a re-run
  # re-enqueues only the still-unembedded chunks. The downloaded dump lives in a
  # named volume and is reused across runs. Override WIKI_MAX_DURATION and
  # WIKI_CORPUS (default simplewiki) via .env or the shell.
  wiki-populate:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command:
      - "go"
      - "run"
      - "./cmd/wikisync"
      - "-mode=bulk"
      # 0 runs to completion (resumable across runs); set WIKI_MAX_DURATION to
      # box a single session, e.g. 15m.
      - "-max-duration=${WIKI_MAX_DURATION:-0}"
      - "-dir=/wiki-dump"
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Bulk (the default) publishes jobs to the broker and the worker fleet does
      # the embedding, so it needs no Voyage key. Delta (`make wiki-update`) reuses
      # this service with -mode=delta and still embeds inline, so it needs the
      # Voyage key, model, and embed tuning below; bulk ignores them.
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large, 1024 dims). A different 1024-dim model needs
      # `make refresh-embeddings` to rebuild the committed seed cache.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
      # Producer tuning (optional; empty uses the binary defaults).
      # WIKI_ENQUEUE_BATCH_SIZE is the page size while publishing. The default
      # bulk-into-live ingest publishes and exits (the fleet fills the live corpus
      # in place, no swap). WIKI_DRAIN_POLL_INTERVAL/WIKI_DRAIN_STALL_TIMEOUT bound
      # the fleet-drain wait only on an -atomic build, which aborts if the remaining
      # count stalls for the timeout so a dead fleet cannot hang the swap.
      WIKI_ENQUEUE_BATCH_SIZE: "${WIKI_ENQUEUE_BATCH_SIZE:-}"
      WIKI_DRAIN_POLL_INTERVAL: "${WIKI_DRAIN_POLL_INTERVAL:-}"
      WIKI_DRAIN_STALL_TIMEOUT: "${WIKI_DRAIN_STALL_TIMEOUT:-}"
      # Inline-embed tuning for the delta path (`make wiki-update`); bulk ignores
      # these. A constrained Voyage tier completes with gentle defaults; raise the
      # batch and concurrency on a higher tier. WIKI_EMBED_RPM caps outbound
      # requests per minute (0 = unpaced). The free tier cannot embed a full
      # corpus in any reasonable time; a paid tier is required.
      WIKI_EMBED_HTTP_TIMEOUT: "${WIKI_EMBED_HTTP_TIMEOUT:-300s}"
      WIKI_EMBED_BATCH_SIZE: "${WIKI_EMBED_BATCH_SIZE:-32}"
      WIKI_EMBED_CONCURRENCY: "${WIKI_EMBED_CONCURRENCY:-2}"
      WIKI_EMBED_RPM: "${WIKI_EMBED_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
      - wiki-dump:/wiki-dump
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # Bring up at least one worker so a bare `make wiki-populate` drains; scale
      # the fleet with `up --scale embedworker=N` beforehand for more throughput.
      embedworker:
        condition: service_started

  # Object storage for uploaded video. Local mirror of the production S3 bucket;
  # the backend talks to both through one storage abstraction selected by config
  # (STORAGE_* env). Console on :9001, S3 API on :9000.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      # Dev-only root credentials; production uses the ECS task role, no keys.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, then creates the media bucket and exits.
  # Idempotent (mc mb --ignore-existing), so repeated up cycles are safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio'; sleep 1;
        done
        mc mb --ignore-existing local/media

  # Message broker for the embedding-job queue. The producer (wiki ingest) will
  # publish prioritized embedding jobs and the worker fleet will drain them; this
  # is the local mirror of the production Amazon MQ for RabbitMQ broker, selected
  # by config (RABBITMQ_URL). 3.13 matches the managed broker's engine line. The
  # default user is loopback-only, so dev credentials are set to allow the other
  # containers (a non-loopback source) to connect. Management UI on :15672, AMQP
  # on :5672.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # Dev-only credentials; production uses Amazon MQ with a Secrets Manager
      # password and never these defaults.
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Embedding worker fleet. Drains prioritized embedding jobs from the broker,
  # embeds a batch of chunks per Voyage call, and writes the vectors back in
  # place - into the live corpus by default (bulk-into-live), or the staging table
  # for an -atomic build; higher-priority chunks are embedded first. Local mirror of
  # the production worker service and scales horizontally - run several replicas
  # with `docker compose --profile wiki up --scale embedworker=4`. It lives under
  # the "wiki" profile because the corpus ingest is what publishes its jobs, so a
  # plain `up` does not start an idle worker. No container_name, so the service
  # can scale.
  embedworker:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/embedworker"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      RABBITMQ_URL: "amqp://app:dev@rabbitmq:5672/"
      # Required for a real embed run; the worker fails fast if unset.
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Must match the ingest/query model everywhere or similarity is meaningless;
      # empty falls back to the binary default (voyage-4-large, 1024 dims).
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # Per-replica tuning. Concurrency bounds the parallel embeds one replica
      # runs (the fleet scales by replica count); MAX_ATTEMPTS is the per-job
      # delivery budget before a persistent failure is dropped with a log; RPM
      # caps outbound Voyage requests per minute (0 = unpaced) for a constrained
      # tier. A shell or .env value overrides each default.
      EMBED_WORKER_CONCURRENCY: "${EMBED_WORKER_CONCURRENCY:-4}"
      EMBED_WORKER_MAX_ATTEMPTS: "${EMBED_WORKER_MAX_ATTEMPTS:-5}"
      EMBED_WORKER_RPM: "${EMBED_WORKER_RPM:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Offline topic-clustering job. Groups the embedded corpus into topic clusters
  # and scores each chunk's importance, writing cluster_id + importance back so
  # the next ingest's producer embeds the most important content first. Opt-in
  # (profile "wiki"), one-shot, no API key: it reads existing embeddings and
  # writes scores. Run it after a corpus is embedded; re-running it over an
  # unchanged corpus is idempotent (the clustering is deterministically seeded):
  #   docker compose --profile wiki run --rm wiki-cluster
  # WIKI_CLUSTER_* tunes the cluster count (raise WIKI_CLUSTER_K for a larger
  # corpus), iterations, seed, and batch sizes.
  wiki-cluster:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikicluster"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # Optional clustering tuning (empty uses the binary defaults).
      WIKI_CLUSTER_K: "${WIKI_CLUSTER_K:-}"
      WIKI_CLUSTER_MAX_ITERS: "${WIKI_CLUSTER_MAX_ITERS:-}"
      WIKI_CLUSTER_SEED: "${WIKI_CLUSTER_SEED:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Clears the live corpus and its sync checkpoint so the next bulk run rebuilds
  # from scratch under the current code - the first step of `make reingest`. The
  # checkpoint keys on the dump version, not the code, so this is what forces a
  # rebuild after the chunker or metadata changed. Opt-in (profile "wiki"),
  # one-shot, no broker or API key: it only touches the database, so it depends on
  # postgres + migrate alone (not the broker or object storage).
  wiki-reset:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikisync", "-mode=reset"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      WIKI_CORPUS: "${WIKI_CORPUS:-simplewiki}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Verifies the rebuilt corpus is complete and servable: chunks present, every
  # chunk embedded with a non-null, non-zero, 1024-dim vector, metadata populated,
  # and the HNSW index live. The last step of `make reingest`; it exits non-zero
  # and logs the failing checks if the corpus is incomplete or stale, so a partial
  # rebuild is caught rather than served. Opt-in (profile "wiki"), one-shot, no API
  # key.
  wiki-verify:
    profiles: ["wiki"]
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/wikiverify"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    environment:
      PORT: "8080"
      # Dev-only credentials; production DATABASE_URL comes from Secrets Manager.
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # AssemblyAI API key from the root .env (see .env.example); the sole
      # transcriber (Universal-3 Pro streaming) for both live streams and
      # imported videos. The server fails fast if unset. Optional tuning falls
      # back to the binary defaults when empty: TRANSCRIPTION_MODEL (u3-rt-pro)
      # and TRANSCRIPTION_MAX_SPEAKERS (provider-decided).
      TRANSCRIPTION_API_KEY: "${TRANSCRIPTION_API_KEY:-}"
      TRANSCRIPTION_MODEL: "${TRANSCRIPTION_MODEL:-}"
      TRANSCRIPTION_MAX_SPEAKERS: "${TRANSCRIPTION_MAX_SPEAKERS:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # Embedding model for ingest and query - must be the SAME everywhere or
      # similarity is meaningless. Empty falls back to the binary default
      # (voyage-4-large: 1024 dims, and its batch endpoint works where base
      # voyage-4's currently hangs). Override only with another 1024-dim Voyage
      # model, and note the committed seed cache is keyed under the default - a
      # different model needs `make refresh-embeddings` to rebuild it.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-}"
      # Live intra-speaker consistency: flag when a speaker contradicts their own
      # earlier statement. Off unless CONSISTENCY_ENABLED is true AND
      # CONSISTENCY_API_KEY (Anthropic) is set; with no key, live analysis behaves
      # exactly as before. Optional tuning falls back to binary defaults when
      # empty: CONSISTENCY_MODEL (claude-haiku-4-5-20251001), CONSISTENCY_TOP_K
      # (3), CONSISTENCY_SIMILARITY_FLOOR (0.6).
      CONSISTENCY_ENABLED: "${CONSISTENCY_ENABLED:-}"
      CONSISTENCY_API_KEY: "${CONSISTENCY_API_KEY:-}"
      CONSISTENCY_MODEL: "${CONSISTENCY_MODEL:-}"
      CONSISTENCY_TOP_K: "${CONSISTENCY_TOP_K:-}"
      CONSISTENCY_SIMILARITY_FLOOR: "${CONSISTENCY_SIMILARITY_FLOOR:-}"
      # Model check-worthiness classifier: upgrade the precheck gate's first stage
      # so casual or personal declaratives are skipped, not fact-checked. Off
      # unless CHECKWORTHINESS_ENABLED is true AND CHECKWORTHINESS_API_KEY
      # (Anthropic) is set; with no key, the heuristic alone decides, exactly as
      # before. CHECKWORTHINESS_MODEL falls back to claude-haiku-4-5-20251001.
      CHECKWORTHINESS_ENABLED: "${CHECKWORTHINESS_ENABLED:-}"
      CHECKWORTHINESS_API_KEY: "${CHECKWORTHINESS_API_KEY:-}"
      CHECKWORTHINESS_MODEL: "${CHECKWORTHINESS_MODEL:-}"
      # The browser's real origin. HTTP /api rides the same-origin frontend proxy
      # so the SameSite=Strict cookie rides along, but the live WebSocket upgrade
      # carries Origin: http://localhost:3000 while the proxy rewrites Host to the
      # backend - a mismatch coder/websocket rejects with 403 unless the origin is
      # allow-listed. This both seeds that allow-list and reflects the CORS header;
      # neither affects the same-origin cookie flow. Empty in prod (the ALB keeps
      # Host, so Origin == Host and same-origin is enforced).
      CORS_ALLOWED_ORIGIN: "http://localhost:3000"
      # Dev-only debug search bar: exposes a WebSocket probe over the embedded
      # wiki corpus at /api/debug/wiki-search and renders the bar in the web UI.
      # Unset in production, where the route is never registered.
      DEBUG_WIKI_SEARCH: "true"
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Local dev runs over plain HTTP, so the session cookie cannot be Secure.
      AUTH_INSECURE_COOKIE: "true"
      # Object storage points at the local MinIO container (path-style, static
      # dev credentials). Production uses the ECS task role, an empty endpoint,
      # and virtual-hosted addressing. Consumed by the upload API.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      # The browser issues the presigned playback GET and upload PUT directly, so
      # those URLs are signed against the host-published MinIO address it can
      # reach (localhost:9000), not the Docker-internal STORAGE_ENDPOINT. Empty in
      # production, where the real S3 URL is already browser-reachable.
      STORAGE_PUBLIC_ENDPOINT: "http://localhost:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
      # YouTube ingest (POST /api/videos/youtube). The dev image bundles a pinned
      # yt-dlp and ffmpeg, so the defaults work as-is. Optional overrides:
      # YOUTUBE_DOWNLOADER_PATH (default "yt-dlp"), YOUTUBE_MAX_DOWNLOAD_BYTES
      # (default 2 GiB), YOUTUBE_DOWNLOAD_TIMEOUT (default 15m).
    ports:
      - "8080:8080"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side rewrite target for the same-origin /api proxy. The
      # browser must never call the backend cross-origin: the session cookie
      # is SameSite=Strict and only rides same-origin /api requests.
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./stack/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  go-mod-cache:
  frontend-node-modules:
  pgdata:
  minio-data:
  wiki-dump:
  rabbitmq-data:
