# Local development. Source is bind-mounted and dev servers run with hot reload.
# Production images are built from stack/*/Dockerfile (used by the deploy workflow).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: truthinstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d truthinstream"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies the golang-migrate up migrations, then exits. The backend
  # waits for it so the schema exists before the API starts.
  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      - "up"
    volumes:
      - ./stack/backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: embeds the curated seed claims and upserts them into pgvector,
  # then exits. Idempotent (claims upsert by id). The backend waits for it so
  # the claim store is populated before the first video is matched. Requires
  # EMBEDDING_API_KEY (the embed call hits Voyage); without it this fails fast.
  ingest:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    command: ["go", "run", "./cmd/ingest"]
    environment:
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Object storage for uploaded video. Local mirror of the production S3 bucket;
  # the backend talks to both through one storage abstraction selected by config
  # (STORAGE_* env). Console on :9001, S3 API on :9000.
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      # Dev-only root credentials; production uses the ECS task role, no keys.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: waits for MinIO, then creates the media bucket and exits.
  # Idempotent (mc mb --ignore-existing), so repeated up cycles are safe.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio'; sleep 1;
        done
        mc mb --ignore-existing local/media

  backend:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    environment:
      PORT: "8080"
      # Dev-only credentials; production DATABASE_URL comes from Secrets Manager.
      DATABASE_URL: "postgres://postgres:dev@postgres:5432/truthinstream?sslmode=disable"
      # From the root .env (see .env.example); the server fails fast if unset.
      TRANSCRIPTION_API_KEY: "${TRANSCRIPTION_API_KEY:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      # No CORS origin: the browser talks to the API same-origin through the
      # frontend proxy so the SameSite=Strict session cookie can ride along.
      AUTH_EMAIL: "${AUTH_EMAIL:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Local dev runs over plain HTTP, so the session cookie cannot be Secure.
      AUTH_INSECURE_COOKIE: "true"
      # Object storage points at the local MinIO container (path-style, static
      # dev credentials). Production uses the ECS task role, an empty endpoint,
      # and virtual-hosted addressing. Consumed by the upload API.
      STORAGE_BUCKET: "media"
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "eu-west-3"
      STORAGE_ACCESS_KEY: "minioadmin"
      STORAGE_SECRET_KEY: "minioadmin"
      STORAGE_USE_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./stack/backend:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ingest:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side rewrite target for the same-origin /api proxy. The
      # browser must never call the backend cross-origin: the session cookie
      # is SameSite=Strict and only rides same-origin /api requests.
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./stack/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  go-mod-cache:
  frontend-node-modules:
  pgdata:
  minio-data:
