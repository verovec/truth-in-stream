# Local development. Source is bind-mounted and dev servers run with hot reload.
# Production images are built from stack/*/Dockerfile (used by the deploy workflow).
services:
  backend:
    build:
      context: ./stack/backend
      target: dev
    working_dir: /app
    environment:
      PORT: "8080"
      LADYBUG_PATH: "/data/ladybug"
    ports:
      - "8080:8080"
    volumes:
      - ./stack/backend:/app
      - ladybug-lib:/app/lib-ladybug
      - go-mod-cache:/go/pkg/mod
      - ladybug-data:/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./stack/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  ladybug-lib:
  go-mod-cache:
  frontend-node-modules:
  ladybug-data:
