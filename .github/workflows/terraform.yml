name: terraform
on:
  push:
    branches: [main]
    paths: ['stack/terraform/**', '.github/workflows/terraform.yml', '.github/workflows/_terraform.yml']
  pull_request:
    paths: ['stack/terraform/**', '.github/workflows/terraform.yml', '.github/workflows/_terraform.yml']
jobs:
  dev:
    uses: ./.github/workflows/_terraform.yml
    # The reusable job requests id-token: write to assume the AWS OIDC role.
    # A called workflow only receives permissions the caller already holds, and
    # the repo default is id-token: none, so the caller must grant it explicitly
    # or GitHub rejects the file at parse time.
    permissions:
      id-token: write
      contents: read
    with:
      path: stack/terraform/dev
      apply: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # Validate + plan the prod root on every relevant PR and push so a prod-only
  # regression (fmt, invalid config, a plan the apply role lacks permission for)
  # is caught before merge. apply is hard-false: prod is never auto-applied - a
  # version tag rolls the services and `terraform apply stack/terraform/prod` is a
  # separate, deliberate human step (see docs/infrastructure.md). Credential-less
  # runs (e.g. fork PRs with no AWS_ROLE_ARN) fall back to offline validate.
  prod:
    uses: ./.github/workflows/_terraform.yml
    permissions:
      id-token: write
      contents: read
    with:
      path: stack/terraform/prod
      apply: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
