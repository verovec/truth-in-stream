name: terraform
on:
  push: { branches: [main], paths: ['stack/terraform/**'] }
  pull_request: { paths: ['stack/terraform/**'] }
jobs:
  dev:
    uses: ./.github/workflows/_terraform.yml
    with:
      path: stack/terraform/dev
      apply: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # prod is intentionally not auto-applied. Promote manually:
  #   cd stack/terraform/prod && terraform init && terraform apply
