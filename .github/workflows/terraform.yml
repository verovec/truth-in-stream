name: terraform
on:
  push:
    branches: [main]
    paths: ['stack/terraform/**', '.github/workflows/terraform.yml', '.github/workflows/_terraform.yml']
  pull_request:
    paths: ['stack/terraform/**', '.github/workflows/terraform.yml', '.github/workflows/_terraform.yml']
jobs:
  dev:
    uses: ./.github/workflows/_terraform.yml
    # The reusable job requests id-token: write to assume the AWS OIDC role.
    # A called workflow only receives permissions the caller already holds, and
    # the repo default is id-token: none, so the caller must grant it explicitly
    # or GitHub rejects the file at parse time.
    permissions:
      id-token: write
      contents: read
    with:
      path: stack/terraform/dev
      apply: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # Validate the prod root on every relevant PR (offline) and plan it with the
  # pre-apply IAM guard on every push to main, so a prod-only regression is
  # caught when the change lands on main, before any tag is cut. apply is
  # hard-false HERE: a plain merge to main never applies prod. Prod is applied
  # by the tag-triggered release
  # (release.yml calls this workflow with apply: true, bound to the `production`
  # Environment approval); standing the stack up the first time stays a
  # deliberate human `terraform apply` (see docs/infrastructure.md).
  # Pull-request runs always validate offline — the prod-writing apply role
  # deliberately does not trust the ungated pull_request OIDC subject
  # (scripts/apply-role-trust.sh) — as do credential-less runs (e.g. fork PRs
  # with no AWS_ROLE_ARN).
  prod:
    uses: ./.github/workflows/_terraform.yml
    permissions:
      id-token: write
      contents: read
    with:
      path: stack/terraform/prod
      apply: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
