name: deploy-keycloak
# Human-gated rolling deploy of the self-hosted Keycloak identity service.
# workflow_dispatch only: an auto-merge to main never deploys. The tag-triggered
# deploy pipeline rolls Keycloak alongside the other services; this per-service
# workflow is for a targeted single-service roll. Relevant paths
# (stack/keycloak/**, .github/workflows/_deploy.yml,
# .github/workflows/deploy-keycloak.yml) are documented here for the operator who
# decides when to dispatch.
on:
  workflow_dispatch:
jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      service: keycloak
      ecr_repo: keycloak
      context: stack/keycloak
      dockerfile: stack/keycloak/Dockerfile
      deploy_mode: rolling
      ecs_service: keycloak
      # Create the keycloak role/database and re-sync its password before the
      # service rolls (Keycloak makes its own tables but not its database).
      db_bootstrap_task: keycloak-db-bootstrap
      # Pin the service to this build's immutable sha-<7> revision. Once a tag
      # release has pinned the service, a plain force-new-deployment would
      # restart the old pinned revision and silently deploy nothing; pinning
      # keeps this wrapper a working hotfix/rollback path (dispatch it from the
      # commit you want live).
      pin_image_tag: true
