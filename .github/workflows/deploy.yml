name: deploy
# Paused: AWS is not configured yet (ECR/ECS absent, AWS_DEPLOY_ROLE_ARN unset).
# Manual-only for now; restore `push: { branches: [main] }` once AWS is ready.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: eu-west-3
  ENVIRONMENT: dev
  PROJECT: truth-in-stream
jobs:
  # Tests and lint gate every deploy: a direct push to main must pass the same
  # checks as a PR before any image is built or published.
  frontend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/frontend, lang: node }
  frontend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/frontend, lang: node }
  backend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/backend, lang: go }
  backend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/backend, lang: go }
  images:
    needs: [frontend-lint, frontend-test, backend-lint, backend-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: stack/backend, dockerfile: stack/backend/Dockerfile }
          - { name: frontend, context: stack/frontend, dockerfile: stack/frontend/Dockerfile }
          - { name: migrate, context: stack/backend, dockerfile: stack/backend/Dockerfile.migrate }
          - { name: backup, context: stack/backend, dockerfile: stack/backend/Dockerfile.backup }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ env.ENVIRONMENT }}-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # Build once locally so the image can be scanned before it is published.
      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      # Cache from the previous step makes this a near-instant re-tag and push.
      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: true
          sbom: true
  deploy:
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run database migrations
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT}-${ENVIRONMENT}"
          # The migrate task definition only exists when RDS is provisioned
          # (enable_rds). With the database developed locally it is absent, so
          # there is nothing to migrate; skip rather than fail the deploy.
          if ! aws ecs describe-task-definition --task-definition "${PROJECT}-${ENVIRONMENT}-migrate" >/dev/null 2>&1; then
            echo "No migrate task definition (enable_rds=false); skipping migrations."
            exit 0
          fi
          SUBNETS=$(aws ssm get-parameter --name "/${PROJECT}/${ENVIRONMENT}/deploy/private-subnet-ids" --query 'Parameter.Value' --output text)
          SG=$(aws ssm get-parameter --name "/${PROJECT}/${ENVIRONMENT}/deploy/tasks-security-group-id" --query 'Parameter.Value' --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "${PROJECT}-${ENVIRONMENT}-migrate" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "run-task did not start a task (capacity or IAM error)"; exit 1
          fi
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed (exit=$EXIT_CODE, reason=$STOP_REASON)"; exit 1
          fi
          echo "Migrations applied"
      - name: Roll services
        run: |
          set -euo pipefail
          CLUSTER="${PROJECT}-${ENVIRONMENT}"
          for SVC in backend frontend; do
            aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --force-new-deployment >/dev/null
            echo "Rolling $SVC"
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services backend frontend
          echo "Deployment stable"
