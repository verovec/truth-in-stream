name: _terraform
on:
  workflow_call:
    inputs:
      path: { type: string, required: true }
      apply: { type: boolean, default: false }
    secrets:
      AWS_ROLE_ARN: { required: false }
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: "${{ inputs.path }}" } }
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # Without AWS credentials we can still validate config (no backend access).
      - if: env.AWS_ROLE_ARN == ''
        run: terraform init -backend=false -input=false
      - if: env.AWS_ROLE_ARN == ''
        run: terraform validate
      # With credentials, init against the real backend and plan (apply on main).
      - if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with: { role-to-assume: "${{ env.AWS_ROLE_ARN }}", aws-region: eu-west-3 }
      - if: env.AWS_ROLE_ARN != ''
        run: terraform init -input=false
      - if: env.AWS_ROLE_ARN != ''
        run: terraform validate
      - if: env.AWS_ROLE_ARN != ''
        run: terraform plan -input=false
      - if: ${{ inputs.apply && env.AWS_ROLE_ARN != '' }}
        run: terraform apply -auto-approve -input=false
