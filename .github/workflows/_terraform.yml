name: _terraform
on:
  workflow_call:
    inputs:
      path: { type: string, required: true }
      apply: { type: boolean, default: false }
    secrets:
      AWS_ROLE_ARN: { required: false }
jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: "${{ inputs.path }}" } }
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive

      # No credentials (e.g. fork PRs): validate offline, no backend access.
      - if: env.AWS_ROLE_ARN == ''
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # With credentials: real backend, then validate and plan.
      - if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with: { role-to-assume: "${{ env.AWS_ROLE_ARN }}", aws-region: eu-west-3 }
      - if: env.AWS_ROLE_ARN != ''
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan

      # Apply exactly the plan produced above (main only).
      - if: ${{ inputs.apply && env.AWS_ROLE_ARN != '' }}
        run: terraform apply -input=false tfplan
