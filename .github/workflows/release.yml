name: release
# Tag-triggered production release. Pushing a semver tag (v*) whose commit is on
# main deploys everything: it first applies stack/terraform/prod, then rolls the
# prod services: backend (with migrations), the self-hosted Keycloak (with its
# DB bootstrap), and frontend. The tag is the deliberate release gesture and
# stands in for the human approval the workflow_dispatch deploy wrappers
# otherwise require: an ordinary merge to main never deploys, only a tag does.
# The workflow_dispatch deploy-* wrappers stay in place untouched for ad-hoc
# single-service rolls and rollbacks (see docs/infrastructure.md).
#
# The terraform job is the one job bound to the `production` GitHub
# Environment: give that environment a required reviewer and the whole release
# is gated behind a single approval click before anything is applied or rolled.
# The deploy jobs deliberately do NOT bind it — binding an environment swaps the
# OIDC subject from the tag ref to repo:<repo>:environment:production, which the
# deploy role's ref-scoped trust (refs/tags/v*, see modules/iam) does not accept,
# and it would multiply the approval clicks per release. The apply role's trust
# DOES accept the environment subject (scripts/apply-role-trust.sh). The apply
# cannot revert the services off their pinned sha-<7> task definitions: the
# service modules ignore task_definition drift (modules/service,
# modules/keycloak), and the job fails fast if AWS_ROLE_ARN is unset instead of
# skipping the apply silently.
#
# Order (needs:): guard -> terraform -> backend -> {keycloak, frontend}. The
# apply runs first so the infrastructure the images roll onto exists and is
# current; backend then runs before the others so migrations land before the
# app serves; keycloak and frontend roll in parallel (frontend does not need
# keycloak, so a keycloak issue never blocks the frontend roll). Every deploy
# job pins the service to this build's immutable sha-<7> task-definition
# revision (pin_image_tag) because on a tag ref the moving `latest` tag is not
# advanced; see _deploy.yml for the rationale.
on:
  push:
    tags:
      - "v*"
# A called workflow only receives permissions the caller already holds, and the
# repo default is id-token: none, so id-token: write must be granted here for the
# OIDC AssumeRole in _terraform.yml and _deploy.yml. contents: read lets the
# guard read the graph.
permissions:
  contents: read
  id-token: write
jobs:
  # Refuse to deploy a tag whose commit is not on main (e.g. cut from a side
  # branch). The tag's ref name is not trusted; release-guard.sh verifies the
  # commit is an ancestor of origin/main against the real commit graph.
  guard:
    name: Guard tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so merge-base can decide ancestry; checkout of a tag
          # ref is detached, so fetch origin/main explicitly below.
          fetch-depth: 0
      - name: Assert tagged commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash scripts/release-guard.sh "$TAG_SHA" origin/main
  # Apply the prod infrastructure before any image rolls, so the release lands
  # on current infra. Plan + pre-apply IAM guard + apply of that exact plan
  # (_terraform.yml). Bound to the `production` Environment: the required
  # reviewer's one approval gates the whole release. require_credentials makes
  # an empty AWS_ROLE_ARN fail the release fast instead of green-skipping the
  # apply.
  terraform:
    name: Apply prod infrastructure
    needs: guard
    uses: ./.github/workflows/_terraform.yml
    permissions:
      contents: read
      id-token: write
    with:
      path: stack/terraform/prod
      apply: true
      environment: production
      require_credentials: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  backend:
    name: Deploy backend (rolling + migrate)
    needs: terraform
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      service: backend
      ecr_repo: backend
      context: stack/backend
      dockerfile: stack/backend/Dockerfile
      deploy_mode: rolling
      ecs_service: backend
      migrate_dockerfile: stack/backend/Dockerfile.migrate
      pin_image_tag: true
  # Deploy the self-hosted Keycloak after the backend. db_bootstrap_task runs the
  # keycloak-db-bootstrap one-shot task (creates its role/database, re-syncs the
  # password) before the service rolls; idempotent, so it is safe on every
  # release. Pinned to this build's sha-<7> revision like the others. The job is
  # gated on Keycloak being provisioned (enable_keycloak=true, the prod
  # default): when you gate Keycloak off to run it out of band, its ECR repo and
  # service do not exist, so set the DEPLOY_KEYCLOAK repository variable to
  # 'false' and the release skips this job instead of failing to push its image.
  keycloak:
    name: Deploy keycloak (bootstrap DB + rolling)
    if: vars.DEPLOY_KEYCLOAK != 'false'
    needs: backend
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      service: keycloak
      ecr_repo: keycloak
      context: stack/keycloak
      dockerfile: stack/keycloak/Dockerfile
      deploy_mode: rolling
      ecs_service: keycloak
      db_bootstrap_task: keycloak-db-bootstrap
      pin_image_tag: true
  frontend:
    name: Deploy frontend (rolling)
    needs: backend
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      service: frontend
      ecr_repo: frontend
      context: stack/frontend
      dockerfile: stack/frontend/Dockerfile
      deploy_mode: rolling
      ecs_service: frontend
      pin_image_tag: true
