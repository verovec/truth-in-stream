name: pr
on:
  pull_request:
jobs:
  frontend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/frontend, lang: node }
  frontend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/frontend, lang: node }
  backend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/backend, lang: go }
  backend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/backend, lang: go }
  # Unit-test the Terraform state-bucket bootstrap script with a stubbed aws CLI
  # (no AWS account or credentials involved).
  bootstrap-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bootstrap-tfstate.test.sh
  # Unit-test the pre-apply IAM guard with a stubbed aws CLI (no AWS account or
  # credentials involved).
  iam-apply-guard-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/iam-apply-guard.test.sh
  # Unit-test the CI apply-role OIDC trust-policy bootstrap with a stubbed aws
  # CLI (no AWS account or credentials involved). Gates the subjects the
  # release.yml prod apply authenticates with.
  apply-role-trust-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/apply-role-trust.test.sh
  # Unit-test the SSM bastion port-forward helper with a stubbed aws CLI (no AWS
  # account, no real SSM session).
  ssm-port-forward-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ssm-port-forward.test.sh
  # Unit-test the RDS SSM port-forward tunnel helper with a stubbed aws CLI (no
  # AWS account, no real SSM session).
  db-tunnel-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-tunnel.test.sh
  # Unit-test the local-DB-into-RDS loader with stubbed aws/docker CLIs (no AWS
  # account, no database, no Docker). Proves the load uses text-format
  # pg_dump/pg_restore (never binary CopyFrom) and never leaks the RDS password.
  db-push-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-push.test.sh
  # Unit-test the /crawler and /consumer account guard (live sts identity vs the
  # committed deploy/targets.json expected account; refuse on mismatch) with a
  # stubbed aws CLI (no AWS account, no real credentials).
  aws-target-guard-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/aws-target-guard.test.sh
  # Unit-test the /crawler and /consumer ingestion-host orchestrator (guard ->
  # required-env validation -> resolve by Name tag -> start-if-stopped -> ssm
  # send-command -> get-command-invocation poll -> optional stop) with a stubbed
  # aws CLI and DRY_RUN (no AWS account, no real EC2/SSM).
  ingest-host-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ingest-host.test.sh
  # Unit-test the host-side env materializer (per-role secret map, atomic 0600
  # write, value-never-logged) with a stubbed aws CLI (no AWS account, no real
  # Secrets Manager).
  ingest-fetch-env-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ingest-fetch-env.test.sh
  # Unit-test the INSEE re-run idempotency checkpoint (count, re-run, assert no
  # growth) with a stubbed psql/aws (no database, no AWS account, no tunnel).
  insee-idempotency-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/insee-idempotency-check.test.sh
  # Format-check the main-account DNS terraform root. That root is applied by
  # hand against the main account and is deliberately excluded from the
  # terraform workflow (no plan/apply, no AWS credentials). This job only runs
  # `terraform fmt -check` so the root stays format-gated; it never inits a
  # backend, assumes a role, plans, or applies.
  main-account-terraform-fmt:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: stack/terraform/main-account
  # Unit-test the local-stack preflight (make doctor) with a stubbed docker CLI
  # (no Docker daemon required).
  doctor-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/doctor.test.sh
  # Unit-test the throwaway integration-test DB provisioning (make test-db/itest)
  # with a stubbed docker CLI (no Docker daemon required).
  test-db-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.test.sh
  # Unit-test the Secrets Manager bulk-push helper with a stubbed aws CLI and a
  # synthetic .env (no AWS account; proves no secret value reaches an argv/log).
  push-secrets-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/push-secrets.test.sh
  # Unit-test the public-repo account-id scanner against throwaway working trees
  # (offline, no AWS): a real-shaped account id in a tracked config/doc/script
  # fails; placeholders, fixtures, out-of-scope files, and gitignored files pass.
  secret-scan-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/secret-scan.test.sh
  # Enforce that no real AWS account id is committed to this public repo. Scans the
  # actual tracked tree; fails the PR on an unrecognized 12-digit account-shaped
  # token outside the allow-list. See the public-repo-hygiene skill.
  account-id-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/secret-scan.sh
  # Unit-test the tag-release main-ancestor guard against real throwaway git
  # repos (git is deterministic and offline): a tag on main passes, a tag off
  # main fails fast. Gates the release.yml tag-deploy path.
  release-guard-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release-guard.test.sh
  # Unit-test the CloudWatch-alarm-to-Slack forwarder Lambda's message formatting
  # (pure, no AWS calls; boto3 is stubbed). The handler ships as a single source
  # file with no build step, so this is its only gate.
  slack-forwarder-test:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m unittest handler_test -v
        working-directory: stack/terraform/modules/observability/forwarder
  # Local Keycloak login smoke test. Boots the docker-compose stack (Postgres,
  # the offline seed, backend, frontend, and the local Keycloak importing
  # realm.json) and runs the build-tagged keycloak_smoke Go test from the host
  # against the published ports. It proves the three legs of local sign-in
  # against a running stack - admin password grant at the token endpoint, the
  # backend accepting that bearer on a representative /api route, and the
  # frontend /auth/login 307 pointing at the public localhost:8081 face. It is a
  # dedicated job because it needs the whole stack up; the build tag keeps it out
  # of the normal backend-test run, which boots only Postgres. The .env holds
  # only synthetic local-dev placeholders (no real key): the smoke path never
  # streams audio or embeds, and the seed is offline from the committed cache.
  keycloak-smoke:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }
      - name: Write synthetic dev .env
        # Written one line per redirect (not an indented heredoc, whose leading
        # YAML whitespace would land in the key names and break compose's
        # ${VAR} substitution). Single-quoted so the argon2id '$' segments are
        # literal, never shell-expanded. Synthetic local-dev placeholders only;
        # the smoke path never streams audio or embeds.
        run: |
          {
            printf '%s\n' 'TRANSCRIPTION_API_KEY=ci-smoke-not-a-real-key'
            printf '%s\n' 'EMBEDDING_API_KEY=ci-smoke-not-a-real-key'
            printf '%s\n' 'AUTH_EMAIL=admin@example.com'
            printf '%s\n' 'AUTH_PASSWORD_HASH=$argon2id$v=19$m=19456,t=2,p=1$shBQcmQC9qrZBGi0S55dZw$8FQY60gGln/W4hIs42tz7yeJ2WEzZFNOCbIlhNdx0k4'
            printf '%s\n' 'SESSION_SECRET=ci-smoke-session-secret-at-least-32-bytes-long'
            printf '%s\n' 'SAMPLE_VIDEO_URL='
          } > .env
      - name: Boot the stack
        # --wait blocks until every started service (and its depends_on chain:
        # postgres, migrate, seed, minio, redis) is healthy or has completed, so
        # the readiness loop below only ever waits on application warm-up, not on
        # the seed one-shot still running.
        run: docker compose up -d --build --wait backend frontend keycloak
      - name: Wait for Keycloak, backend, and frontend
        run: |
          probe() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$1")
            [ "$code" = "200" ] || [ "$code" = "307" ]
          }
          for svc in \
            "http://localhost:8081/realms/truth-in-stream/.well-known/openid-configuration" \
            "http://localhost:8080/healthz" \
            "http://localhost:3000/auth/login"; do
            echo "waiting for $svc"
            for i in $(seq 1 60); do
              if probe "$svc"; then echo "ready: $svc"; break; fi
              if [ "$i" = "60" ]; then echo "timed out waiting for $svc"; exit 1; fi
              sleep 5
            done
          done
      - name: Run the Keycloak login smoke test
        working-directory: stack/backend
        run: go test -tags keycloak_smoke -count=1 ./internal/keycloaksmoke/
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
