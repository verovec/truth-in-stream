name: pr
on:
  pull_request:
jobs:
  frontend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/frontend, lang: node }
  frontend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/frontend, lang: node }
  # Backend CI is paused. The reusable Go workflows run `go vet` / `go test ./...`
  # with no `system_ladybug` build tag, native Ladybug lib, or CGO flags, so they
  # cannot compile the embedded graph store. Re-enable (drop `if: false`) once the
  # Go CI is wired for the cgo build. See docs/superpowers/specs for VER-13.
  backend-lint:
    if: false
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/backend, lang: go }
  backend-test:
    if: false
    uses: ./.github/workflows/_test.yml
    with: { path: stack/backend, lang: go }
