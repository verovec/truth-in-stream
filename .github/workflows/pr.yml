name: pr
on:
  pull_request:
jobs:
  frontend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/frontend, lang: node }
  frontend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/frontend, lang: node }
  backend-lint:
    uses: ./.github/workflows/_lint.yml
    with: { path: stack/backend, lang: go }
  backend-test:
    uses: ./.github/workflows/_test.yml
    with: { path: stack/backend, lang: go }
  # Unit-test the Terraform state-bucket bootstrap script with a stubbed aws CLI
  # (no AWS account or credentials involved).
  bootstrap-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bootstrap-tfstate.test.sh
  # Unit-test the pre-apply IAM guard with a stubbed aws CLI (no AWS account or
  # credentials involved).
  iam-apply-guard-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/iam-apply-guard.test.sh
  # Unit-test the SSM bastion port-forward helper with a stubbed aws CLI (no AWS
  # account, no real SSM session).
  ssm-port-forward-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ssm-port-forward.test.sh
  # Unit-test the RDS SSM port-forward tunnel helper with a stubbed aws CLI (no
  # AWS account, no real SSM session).
  db-tunnel-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-tunnel.test.sh
  # Unit-test the local-DB-into-RDS loader with stubbed aws/docker CLIs (no AWS
  # account, no database, no Docker). Proves the load uses text-format
  # pg_dump/pg_restore (never binary CopyFrom) and never leaks the RDS password.
  db-push-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-push.test.sh
  # Unit-test the ingestion deploy helper (producer repin, worker fleet roll via
  # the lifecycle lambda, queue-version roll) with a stubbed aws CLI (no AWS
  # account, no real ECS or lambda).
  deploy-ingestion-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy-ingestion.test.sh
  # Format-check the main-account DNS terraform root. That root is applied by
  # hand against the main account and is deliberately excluded from the
  # terraform workflow (no plan/apply, no AWS credentials). This job only runs
  # `terraform fmt -check` so the root stays format-gated; it never inits a
  # backend, assumes a role, plans, or applies.
  main-account-terraform-fmt:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: stack/terraform/main-account
  # Unit-test the local-stack preflight (make doctor) with a stubbed docker CLI
  # (no Docker daemon required).
  doctor-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/doctor.test.sh
  # Unit-test the Secrets Manager bulk-push helper with a stubbed aws CLI and a
  # synthetic .env (no AWS account; proves no secret value reaches an argv/log).
  push-secrets-script:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/push-secrets.test.sh
